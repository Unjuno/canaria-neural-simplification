name: smallvit-objective-control
on:
  push:
    branches: [research/smallvit-objective-control-2026-09-25]
    paths:
      - scripts/replication/smallvit_objective_control.py
      - .github/workflows/smallvit-objective-control.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: smallvit-objective-control-2026-09-25
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen scientific environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 scikit-learn==1.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10298981210'
          run-id: '34696045678'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: /tmp/preflight/original
      - name: Audit unchanged original hidden-test cohort
        run: python tools/audit_smallvit_hidden_closure.py --input /tmp/preflight/original --out /tmp/preflight/CLOSURE_AUDIT.json
      - name: Synthetic pairing, count, finite-value and test-guard tests
        run: |
          python -m py_compile scripts/replication/smallvit_objective_control.py tools/audit_smallvit_hidden_closure.py
          python scripts/replication/smallvit_objective_control.py --mode selftest --out /tmp/preflight/synthetic
      - name: Noninferential verification seed only
        run: python scripts/replication/smallvit_objective_control.py --mode seed --seed 193999 --out /tmp/preflight/verification
      - name: Retain exact producing source
        if: always()
        run: |
          mkdir -p /tmp/preflight
          git archive --format=zip HEAD -o /tmp/preflight/source.zip
          git rev-parse HEAD > /tmp/preflight/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: svo-preflight
          path: /tmp/preflight
          retention-days: 90
          if-no-files-found: error
  seed:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [194000,194001,194002,194003,194004,194005,194006,194007,194008,194009,194010,194011,194012,194013,194014,194015]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen scientific environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 scikit-learn==1.9.0
      - name: Fit fixed arms once; retain ineligible and failed attempts
        run: python scripts/replication/smallvit_objective_control.py --mode seed --seed ${{ matrix.seed }} --out /tmp/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seed_${{ matrix.seed }}
          path: /tmp/out
          retention-days: 90
          if-no-files-found: error
  aggregate:
    needs: [preflight, seed]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: seed_*
          path: /tmp/fresh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: svo-preflight
          path: /tmp/preflight
      - name: Evaluate all attempted records and reconstruct prediction correctness
        run: python scripts/replication/smallvit_objective_control.py --mode evaluate --input /tmp/fresh --out /tmp/aggregate
      - name: Prepare immutable evidence copy and manifest
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('results/replication/smallvit_objective_control')
          shutil.copytree('/tmp/fresh',root/'fresh',dirs_exist_ok=True)
          for n in ['DECISION.json','FRESH_ROWS.json']: shutil.copyfile('/tmp/aggregate/'+n,root/n)
          shutil.copytree('/tmp/preflight/verification',root/'verification',dirs_exist_ok=True)
          shutil.copyfile('/tmp/preflight/synthetic/PREFLIGHT.json',root/'PREFLIGHT.json')
          old=Path('results/replication/vit_hidden_test_confirm')
          shutil.copytree('/tmp/preflight/original/all',old/'raw',dirs_exist_ok=True)
          shutil.copyfile('/tmp/preflight/CLOSURE_AUDIT.json',old/'CLOSURE_AUDIT.json')
          d=json.loads((root/'DECISION.json').read_text())
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          manifest={'experiment':d['experiment'],'protocol_commit':'3e847e83dbb76af90828b2c137983c8ea5dee35f','source_commit':os.environ['GITHUB_SHA'],'workflow_run':int(os.environ['GITHUB_RUN_ID']),'seed_plan':list(range(194000,194016)),'verification_seed':193999,'files':files,'technical_repetition_adds_scientific_seeds':False,'main_modified':False,'external_review':False}
          (root/'RUN_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'RESULT.md').write_text('# SmallViT fixed-topology objective control\n\nDecision: `'+d['decision']+'`.\n\nSee DECISION.json, FRESH_ROWS.json and fresh/ for the full attempted cohort, fixed-arm outputs, pre-test freeze certificates, exact source and environment provenance.\n\nThis is prospective exploratory mechanism evidence, conditional on the validation-qualified teachers, one reused digits split, width8 SmallViT grammar and the recorded CPU environment. Joint fitting changes both supervision and the second module training input distribution. It cannot uniquely separate those mechanisms, establish a minimum budget, or demonstrate whole-model/runtime/memory gains. Technical and source audits are not external scientific review.\n')
          PY
      - name: Persist only audited evidence on this research branch, never main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/smallvit-objective-control-2026-09-25'
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/replication/vit_hidden_test_confirm/raw results/replication/vit_hidden_test_confirm/CLOSURE_AUDIT.json results/replication/smallvit_objective_control
          git commit -m 'Persist original SmallViT evidence closure and locked objective-control outcomes'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF"
      - name: Bundle source, raw outcomes and audits
        if: always()
        run: |
          mkdir -p /tmp/bundle
          git archive --format=zip HEAD -o /tmp/bundle/source_and_evidence.zip
          cp -r /tmp/aggregate /tmp/bundle/aggregate || true
          cp -r /tmp/fresh /tmp/bundle/fresh || true
          cp /tmp/preflight/CLOSURE_AUDIT.json /tmp/bundle/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smallvit-objective-control-evidence
          path: /tmp/bundle
          retention-days: 90
          if-no-files-found: error
