name: r87-sqrt64-profile-validation
on:
  push:
    branches: [research/r87-portable-profile-validation]
    paths: ['.github/workflows/r87-sqrt-profile.yml']
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Export exact small source subset before outcomes
        run: |
          mkdir -p /tmp/source
          tar -czf /tmp/source/source.tar.gz scripts/reproduction_diagnostics results/reproduction/r87_sqrt_profile/PROTOCOL.json results/reproduction/r87_portable_profile/PROTOCOL.json results/reproduction/r87r1_fresh_profile
          git rev-parse HEAD > /tmp/source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r87d7-source
          path: /tmp/source
          if-no-files-found: error
          retention-days: 90
  hosts:
    strategy:
      fail-fast: false
      matrix:
        slot: [a,b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install the fixed primary environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0 joblib==1.5.3 threadpoolctl==3.6.0 sympy==1.14.0 networkx==3.6.1 filelock==3.29.0 fsspec==2026.4.0 jinja2==3.1.6 typing_extensions==4.16.0
          python -m pip check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r87d5-host-a
          run-id: 34528254562
          github-token: ${{ github.token }}
          path: /tmp/inputs
      - name: Corrected common-input replay including separately labelled intervention
        run: |
          mkdir -p /tmp/r87d7/replay
          python scripts/reproduction_diagnostics/r87_optimizer_replay.py --trace /tmp/inputs/1200_portable_v1/trace.npz --seed 1200 --capability avx2 --out /tmp/r87d7/replay/stock_avx2
          python scripts/reproduction_diagnostics/r87_optimizer_replay.py --trace /tmp/inputs/1200_portable_v1/trace.npz --seed 1200 --capability default --out /tmp/r87d7/replay/stock_default
          python scripts/reproduction_diagnostics/r87_optimizer_replay.py --trace /tmp/inputs/1200_portable_v1/trace.npz --seed 1200 --capability avx2 --sqrt64 --out /tmp/r87d7/replay/sqrt64_avx2
      - name: Complete exact bridge and the entire known cohort with fixed repeats
        run: |
          python -m pip freeze > /tmp/r87d7/pip-freeze.txt
          lscpu > /tmp/r87d7/lscpu.txt
          python scripts/reproduction_diagnostics/r87_sqrt_profile.py --mode suite --out /tmp/r87d7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r87d7-host-${{ matrix.slot }}
          path: /tmp/r87d7
          if-no-files-found: error
          retention-days: 90
