name: r87r2-fresh-sqrt-profile-confirmation
on:
  push:
    branches: [research/r87-portable-profile-validation]
    paths: ['.github/workflows/r87r2-fresh.yml']
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p /tmp/source
          tar -czf /tmp/source/source.tar.gz scripts/reproduction_diagnostics results/reproduction/r87r2_fresh_sqrt_profile/PROTOCOL.json results/reproduction/r87_sqrt_profile/VALIDATION_GATE.json results/reproduction/r87_sqrt_profile/PROTOCOL.json
          git rev-parse HEAD > /tmp/source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r87r2-source
          path: /tmp/source
          if-no-files-found: error
          retention-days: 90
  precondition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require completed D7 and the fixed all-host validation gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          d=json.loads(Path('results/reproduction/r87_sqrt_profile/VALIDATION_GATE.json').read_text())
          assert d['decision']=='TESTED_HOST_PROFILE_PASS' and d['all_three_host_pairs_exact'] and d['all6_within_host_repeats_exact']
          assert d['comparison_sha256']=='b2b98d5b80a852b39d8f8f801b71ca092926986bdd7a8cdbd511bd8b55030b15'
          req=urllib.request.Request('https://api.github.com/repos/Unjuno/canaria-neural-simplification/actions/runs/34530338267',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req))
          assert r['status']=='completed' and r['conclusion']=='success' and r['head_sha']=='a5e2cf5bafd099332e0b354fa8adf01d3771cdd9'
          print('PROFILE PREREQUISITE PASS; historical archive not recovered')
          PY
  hosts:
    needs: precondition
    strategy:
      fail-fast: false
      matrix:
        slot: [a,b]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install unchanged profile environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0 joblib==1.5.3 threadpoolctl==3.6.0 sympy==1.14.0 networkx==3.6.1 filelock==3.29.0 fsspec==2026.4.0 jinja2==3.1.6 typing_extensions==4.16.0
          python -m pip check
      - name: Synthetic tests before any fresh outcomes
        run: python scripts/reproduction_diagnostics/r87r2_confirm.py --mode selftest
      - name: Known bridge then complete prospectively fixed16 seeds
        run: |
          mkdir -p /tmp/r87r2
          python -m pip freeze > /tmp/r87r2/pip-freeze.txt
          lscpu > /tmp/r87r2/lscpu.txt
          python scripts/reproduction_diagnostics/r87r2_confirm.py --mode suite --workers 2 --out /tmp/r87r2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r87r2-host-${{ matrix.slot }}
          path: /tmp/r87r2
          if-no-files-found: error
          retention-days: 90
