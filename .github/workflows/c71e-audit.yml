name: c71e-evidence-audit

on:
  push:
    branches:
      - research/c71e-p64-pipeline-bottleneck-localization
    paths:
      - '.github/workflows/c71e-audit.yml'
      - 'scripts/gaussian_shift_interface/evaluate_c71e.py'
      - 'tests/test_c71e_evaluator.py'
      - 'results/gaussian_shift_interface/c71e/**'
  pull_request:
    paths:
      - '.github/workflows/c71e-audit.yml'
      - 'scripts/gaussian_shift_interface/evaluate_c71e.py'
      - 'tests/test_c71e_evaluator.py'
      - 'results/gaussian_shift_interface/c71e/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Evaluator tests and syntax
        run: |
          python -m py_compile scripts/gaussian_shift_interface/evaluate_c71e.py
          python -m unittest tests.test_c71e_evaluator -v
      - name: Recompute persisted C71E exploratory decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c71e.py \
            results/gaussian_shift_interface/c71e/FRESH_ROWS.json \
            --out /tmp/c71e_recomputed.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          got = json.loads(Path('/tmp/c71e_recomputed.json').read_text())
          locked = json.loads(Path('results/gaussian_shift_interface/c71e/DECISION.json').read_text())

          def same(a, b, path='root'):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert set(a) == set(b), (path, set(a) ^ set(b))
                  for k in a:
                      same(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), (path, len(a), len(b))
                  for i, (x, y) in enumerate(zip(a, b)):
                      same(x, y, f'{path}[{i}]')
              elif isinstance(a, float) or isinstance(b, float):
                  assert math.isclose(float(a), float(b), rel_tol=1e-12, abs_tol=1e-12), (path, a, b)
              else:
                  assert a == b, (path, a, b)

          same(got, locked)
          assert got['decision'] == 'LOCALIZE_SHARED_MAPPING_OR_CALIBRATION_LIMIT'
          assert got['evidence_class'] == 'PROSPECTIVE_EXPLORATORY'
          assert got['confirmatory_claim_allowed'] is False
          assert got['reduced_dimension_selection_allowed'] is False
          assert got['attempted_rows_present'] == 16
          assert got['eligible_count'] == 16
          assert got['missing_seed_rows'] == []
          assert got['bootstrap_resamples'] == 100000
          assert got['bootstrap_seed'] == 3326093687
          assert got['robust_target_validity']['pass'] is True
          assert got['stage_validity_pattern'] == [False, False, False]
          assert got['descriptive_stage_diagnostics']['max_full_basis_relative_calibration_residual_sqerr'] <= 1e-10
          print('C71E PORTABLE PERSISTED DECISION RECOMPUTATION PASS')
          PY
