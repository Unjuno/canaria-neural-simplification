name: phase3-regression-exploration

on:
  push:
    branches:
      - research/phase3-regression-external-validity
    paths:
      - .github/workflows/phase3-regression-exploration.yml
      - scripts/phase3/regression_external_validity/run_seed.py
      - results/phase3/regression_external_validity/EXPLORATION_PROTOCOL.json

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install experiment dependencies
        run: python -m pip install numpy torch scikit-learn

      - name: Run exploration-only seeds
        run: |
          set -euo pipefail
          OUT=results/phase3/regression_external_validity/exploration
          mkdir -p "$OUT"
          for SEED in 2100 2101 2102; do
            python scripts/phase3/regression_external_validity/run_seed.py \
              --seed "$SEED" \
              --out "$OUT/seed_${SEED}.json" \
              --nmse-threshold 0.08 \
              --r2-tolerance 0.05 \
              --grid 2,4,6,8,12,16,24 \
              --teacher-epochs 60 \
              --map-updates 600
          done

      - name: Build exploration summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('results/phase3/regression_external_validity/exploration')
          seeds = [2100, 2101, 2102]
          runs = [json.loads((root / f'seed_{s}.json').read_text()) for s in seeds]
          summary = {
              'status': 'EXPLORATION_ONLY_NOT_FOR_CONFIRMATORY_INFERENCE',
              'seeds': seeds,
              'teacher_val_r2': [r['teacher_val_r2'] for r in runs],
              'provisional_selected_sep_budget': [None if r['selected_sep'] is None else r['selected_sep']['budget'] for r in runs],
              'provisional_selected_comp_budget': [None if r['selected_comp'] is None else r['selected_comp']['budget'] for r in runs],
              'provisional_log2_ratio': [r['log2_budget_ratio'] for r in runs],
              'grid_diagnostics': {
                  str(r['seed']): [
                      {
                          'h': row['h'],
                          'budget': row['budget'],
                          'sep_nmse': row['sep_nmse'],
                          'comp_nmse': row['comp_nmse'],
                          'sep_val_r2': row['sep_val_r2'],
                          'comp_val_r2': row['comp_val_r2'],
                      }
                      for row in r['grid']
                  ]
                  for r in runs
              },
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit exploration evidence to research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase3/regression_external_validity/exploration
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Phase 3 regression exploration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
