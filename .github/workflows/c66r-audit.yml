name: c66r-evidence-audit

on:
  push:
    branches:
      - research/c66r-shift-severity-frontier
    paths:
      - '.github/workflows/c66r-audit.yml'
      - 'scripts/gaussian_shift_interface/evaluate_c66r.py'
      - 'tests/test_c66r_evaluator.py'
      - 'results/gaussian_shift_interface/c66r/**'
  pull_request:
    paths:
      - '.github/workflows/c66r-audit.yml'
      - 'scripts/gaussian_shift_interface/evaluate_c66r.py'
      - 'tests/test_c66r_evaluator.py'
      - 'results/gaussian_shift_interface/c66r/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Evaluator tests and syntax
        run: |
          python -m py_compile scripts/gaussian_shift_interface/evaluate_c66r.py
          python -m unittest tests.test_c66r_evaluator -v
      - name: Recompute persisted C66R exploratory decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c66r.py \
            results/gaussian_shift_interface/c66r/FRESH_ROWS.json \
            --out /tmp/c66r_recomputed.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          got = json.loads(Path('/tmp/c66r_recomputed.json').read_text())
          locked = json.loads(Path('results/gaussian_shift_interface/c66r/DECISION.json').read_text())

          def same(a, b, path='root'):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert set(a) == set(b), (path, set(a) ^ set(b))
                  for k in a:
                      same(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), (path, len(a), len(b))
                  for i, (x, y) in enumerate(zip(a, b)):
                      same(x, y, f'{path}[{i}]')
              elif isinstance(a, float) or isinstance(b, float):
                  assert math.isclose(float(a), float(b), rel_tol=1e-12, abs_tol=1e-12), (path, a, b)
              else:
                  assert a == b, (path, a, b)

          same(got, locked)
          assert got['decision'] == 'NO_P0_FAILURE_THROUGH_SIGMA_0_20'
          assert got['evidence_class'] == 'PROSPECTIVE_EXPLORATORY'
          assert got['confirmatory_claim_allowed'] is False
          assert got['attempted_rows_present'] == 16
          assert got['eligible_count'] == 16
          assert got['missing_seed_rows'] == []
          assert got['bootstrap_resamples'] == 100000
          assert got['bootstrap_seed'] == 4017607924
          assert got['joint_pass_pattern'] == [True, True, True, True, True]
          assert got['selected_sigma_for_confirmation'] is None
          assert all(x['joint_pass'] for x in got['severity_curve'].values())
          print('C66R PORTABLE PERSISTED DECISION RECOMPUTATION PASS')
          PY
