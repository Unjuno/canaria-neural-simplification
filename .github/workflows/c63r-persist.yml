name: c63r-persist-evidence

on:
  push:
    branches:
      - research/c63r-p2-confirmation
    paths:
      - '.github/workflows/c63r-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked C63R aggregate artifact
        uses: actions/download-artifact@v4
        with:
          name: c63r-aggregate-decision
          path: /tmp/c63r-aggregate
          github-token: ${{ github.token }}
          repository: Unjuno/canaria-neural-simplification
          run-id: 33661554612
      - name: Persist rows and decision without alteration
        run: |
          mkdir -p results/gaussian_shift_interface/c63r
          cp /tmp/c63r-aggregate/rows.json results/gaussian_shift_interface/c63r/FRESH_ROWS.json
          cp /tmp/c63r-aggregate/decision.json results/gaussian_shift_interface/c63r/DECISION.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for p in [
              Path('results/gaussian_shift_interface/c63r/FRESH_ROWS.json'),
              Path('results/gaussian_shift_interface/c63r/DECISION.json'),
          ]:
              print(p, hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit persisted evidence
        run: |
          git config user.name 'canaria-evidence-bot'
          git config user.email 'canaria-evidence-bot@users.noreply.github.com'
          git add results/gaussian_shift_interface/c63r/FRESH_ROWS.json results/gaussian_shift_interface/c63r/DECISION.json
          git commit -m 'Persist C63R fresh rows and locked confirmatory decision'
          git push origin HEAD:research/c63r-p2-confirmation
