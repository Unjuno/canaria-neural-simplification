name: c67e-persist-evidence

on:
  push:
    branches:
      - research/c67e-extended-shift-severity-frontier
    paths:
      - '.github/workflows/c67e-persist.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked C67E aggregate artifact
        uses: actions/download-artifact@v4
        with:
          name: c67e-aggregate-decision
          path: /tmp/c67e-aggregate
          github-token: ${{ github.token }}
          repository: Unjuno/canaria-neural-simplification
          run-id: 33995671866
      - name: Persist rows and decision without alteration
        run: |
          mkdir -p results/gaussian_shift_interface/c67e
          cp /tmp/c67e-aggregate/rows.json results/gaussian_shift_interface/c67e/FRESH_ROWS.json
          cp /tmp/c67e-aggregate/decision.json results/gaussian_shift_interface/c67e/DECISION.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for p in [
              Path('results/gaussian_shift_interface/c67e/FRESH_ROWS.json'),
              Path('results/gaussian_shift_interface/c67e/DECISION.json'),
          ]:
              print(p, hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit persisted evidence
        run: |
          git config user.name 'canaria-evidence-bot'
          git config user.email 'canaria-evidence-bot@users.noreply.github.com'
          git add results/gaussian_shift_interface/c67e/FRESH_ROWS.json results/gaussian_shift_interface/c67e/DECISION.json
          git commit -m 'Persist C67E fresh rows and locked exploratory validity-boundary decision'
          git push origin HEAD:research/c67e-extended-shift-severity-frontier
