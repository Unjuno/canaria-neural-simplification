name: preannouncement-core-digits-reproduction

on:
  push:
    branches:
      - maintenance/pre-announcement-hardening-2026-08-27

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Reproduce full confirmatory cohort
        run: |
          python scripts/reproduce/core_discovery_digits/verify_confirmatory.py \
            --out core_discovery_digits_pinned_env_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-discovery-digits-pinned-env-report
          path: core_discovery_digits_pinned_env_report.json
          if-no-files-found: error
