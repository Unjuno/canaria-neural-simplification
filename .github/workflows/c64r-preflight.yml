name: c64r-preflight

on:
  push:
    branches:
      - research/c64r-p0-p1-p2-task-weighted-frontier
    paths:
      - '.github/workflows/c64r-preflight.yml'
      - 'scripts/gaussian_shift_interface/run_c64r_seed.py'
      - 'scripts/gaussian_shift_interface/evaluate_c64r.py'
      - 'tests/test_c64r_evaluator.py'
      - 'results/gaussian_shift_interface/c64r/PROTOCOL.json'

jobs:
  verification-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Syntax and evaluator tests
        run: |
          python -m py_compile scripts/gaussian_shift_interface/run_c64r_seed.py
          python -m py_compile scripts/gaussian_shift_interface/evaluate_c64r.py
          python -m unittest tests.test_c64r_evaluator -v
      - name: Run implementation verification seed 62300
        run: |
          mkdir -p c64r-preflight
          python scripts/gaussian_shift_interface/run_c64r_seed.py \
            --seed 62300 \
            --allow-verification-seed \
            --out c64r-preflight/seed_62300.json
      - name: Verify locked exploratory invariants
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          r = json.loads(Path('c64r-preflight/seed_62300.json').read_text())
          assert r['experiment'] == 'C64R_P0_P1_P2_TASK_WEIGHTED_FRONTIER_EXPLORATION'
          assert r['evidence_class'] == 'PROSPECTIVE_EXPLORATORY'
          assert r['status'] == 'IMPLEMENTATION_VERIFICATION_OUTCOME'
          assert r['eligible'] is True
          assert r['test_evaluated'] is False
          assert r['protocol']['sigma'] == 0.04
          assert r['protocol']['calibration_samples'] == 192
          assert r['protocol']['dimensions'] == [0, 1, 2]
          assert r['protocol']['top_adaptation_seed'] == 62300 + 645000
          assert r['protocol']['final_init_seed'] == 62300 + 646000
          assert r['protocol']['final_fit_seed'] == 62300 + 647000
          assert r['budget']['exact_4096_each_level'] is True
          assert r['conditions']['p0']['dimension'] == 0
          assert r['conditions']['p0']['teacher_correction_applied'] is False
          assert r['conditions']['p0']['top_boundary_adaptation_skipped'] is True
          assert r['conditions']['p1']['dimension'] == 1
          assert r['conditions']['p2']['dimension'] == 2
          assert r['provenance_hashes']['nested_q1_sha256']
          assert r['provenance_hashes']['nested_q2_sha256']
          assert r['provenance_hashes']['teacher_head_weight_sha256']
          for split in ('shifted_calibration', 'shifted_validation'):
              g = r['diagnostics']['task_weighted_geometry'][split]
              assert g['p0']['euclidean_capture_fraction'] == 0.0
              assert abs(g['p0']['logit_l2_retained_ratio'] - 1.0) < 1e-6
              assert abs(g['p0']['fisher_retained_ratio'] - 1.0) < 1e-6
              assert g['p2']['euclidean_capture_fraction'] >= g['p1']['euclidean_capture_fraction']
              for pk in ('p0','p1','p2'):
                  for key in ('euclidean_capture_fraction','logit_l2_retained_ratio','fisher_retained_ratio'):
                      assert math.isfinite(float(g[pk][key]))
                      assert float(g[pk][key]) >= 0.0
          print('C64R PREFLIGHT PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c64r-preflight-seed-62300
          path: c64r-preflight/seed_62300.json
          if-no-files-found: error
          retention-days: 90
