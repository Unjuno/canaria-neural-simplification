name: c61r-fresh-confirmatory

on:
  push:
    branches:
      - research/c61r-prospective-replication
    paths:
      - '.github/workflows/c61r-fresh.yml'

jobs:
  fresh-seeds:
    name: seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [59400, 59401, 59402, 59403, 59404, 59405, 59406, 59407, 59408, 59409, 59410, 59411, 59412, 59413, 59414, 59415]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Run locked fresh seed
        run: |
          mkdir -p c61r-seed
          python scripts/gaussian_shift_interface/run_c61r_seed.py \
            --seed ${{ matrix.seed }} \
            --out c61r-seed/seed_${{ matrix.seed }}.json
      - name: Assert fresh provenance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          seed = int('${{ matrix.seed }}')
          r = json.loads(Path(f'c61r-seed/seed_{seed}.json').read_text())
          assert r['seed'] == seed
          assert r['status'] == 'FRESH_SEED_OUTCOME'
          assert r['test_evaluated'] is False
          assert r['protocol']['sigma'] == 0.04
          assert r['protocol']['calibration_samples'] == 192
          assert r['budget']['exact_4096_each_level'] is True
          assert r['p4']['dimension'] == 4
          assert r['p8']['dimension'] == 8
          print('C61R FRESH SEED INTEGRITY PASS', seed)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c61r-seed-${{ matrix.seed }}
          path: c61r-seed/seed_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: locked-aggregate-decision
    if: always()
    needs: fresh-seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Download all successful seed artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: c61r-seed-*
          path: downloaded
          merge-multiple: true
      - name: Build complete attempted-row ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = list(range(59400, 59416))
          rows_by_seed = {}
          for p in Path('downloaded').glob('seed_*.json'):
              full = json.loads(p.read_text())
              row = full['decision_row']
              rows_by_seed[int(row['seed'])] = row
          rows = []
          for seed in expected:
              if seed in rows_by_seed:
                  rows.append(rows_by_seed[seed])
              else:
                  rows.append({'seed': seed, 'eligible': False, 'failure': 'missing_seed_artifact'})
          Path('c61r-aggregate').mkdir(exist_ok=True)
          Path('c61r-aggregate/rows.json').write_text(json.dumps({'rows': rows}, indent=2, sort_keys=True) + '\n')
          print('successful_seed_artifacts', len(rows_by_seed))
          print(Path('c61r-aggregate/rows.json').read_text())
          PY
      - name: Apply prospectively locked decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c61r.py \
            c61r-aggregate/rows.json \
            --out c61r-aggregate/decision.json
          cat c61r-aggregate/decision.json
      - uses: actions/upload-artifact@v4
        with:
          name: c61r-aggregate-decision
          path: c61r-aggregate/
          if-no-files-found: error
          retention-days: 90
