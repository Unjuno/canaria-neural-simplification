name: phase3-regression-confirmatory

on:
  push:
    branches:
      - research/phase3-regression-external-validity
    paths:
      - .github/workflows/phase3-regression-confirmatory.yml

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify protocol was locked before this workflow commit
        run: |
          set -euo pipefail
          test -f results/phase3/regression_external_validity/CONFIRMATORY_PROTOCOL.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('results/phase3/regression_external_validity/CONFIRMATORY_PROTOCOL.json').read_text())
          assert p['status'] == 'LOCKED_BEFORE_CONFIRMATORY_OUTCOMES'
          assert p['confirmatory_seeds'] == list(range(2200, 2208))
          assert p['selection_rule']['span_nmse_lte'] == 0.12
          assert p['selection_rule']['val_r2_gte_teacher_minus'] == 0.05
          assert p['replacement']['h_grid'] == [2,4,6,8,12,16,20,24,32]
          print('CONFIRMATORY PROTOCOL LOCK VERIFIED')
          PY

      - name: Install experiment dependencies
        run: python -m pip install numpy torch scikit-learn

      - name: Run locked fresh seeds exactly once
        run: |
          set -euo pipefail
          OUT=results/phase3/regression_external_validity/confirmatory
          mkdir -p "$OUT"
          for SEED in 2200 2201 2202 2203 2204 2205 2206 2207; do
            python scripts/phase3/regression_external_validity/run_seed.py \
              --seed "$SEED" \
              --out "$OUT/seed_${SEED}.json" \
              --nmse-threshold 0.12 \
              --r2-tolerance 0.05 \
              --grid 2,4,6,8,12,16,20,24,32 \
              --teacher-epochs 60 \
              --map-updates 600
          done

      - name: Build locked confirmatory summary
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np

          root = Path('results/phase3/regression_external_validity/confirmatory')
          protocol = json.loads(Path('results/phase3/regression_external_validity/CONFIRMATORY_PROTOCOL.json').read_text())
          seeds = protocol['confirmatory_seeds']
          runs = [json.loads((root / f'seed_{s}.json').read_text()) for s in seeds]
          comparable = [r for r in runs if r['selected_sep'] is not None and r['selected_comp'] is not None]
          missing = [
              {'seed': r['seed'], 'missing_sep': r['selected_sep'] is None, 'missing_comp': r['selected_comp'] is None}
              for r in runs if r['selected_sep'] is None or r['selected_comp'] is None
          ]
          rows = []
          for r in runs:
              sep, comp = r['selected_sep'], r['selected_comp']
              rows.append({
                  'seed': r['seed'],
                  'teacher_val_r2': r['teacher_val_r2'],
                  'teacher_test_r2': r['teacher_test_r2'],
                  'sep_budget': None if sep is None else sep['budget'],
                  'comp_budget': None if comp is None else comp['budget'],
                  'log2_budget_ratio': r['log2_budget_ratio'],
                  'test_r2_diff_comp_minus_sep': r['test_r2_diff_comp_minus_sep'],
              })
          summary = {
              'protocol_status': protocol['status'],
              'confirmatory_seeds': seeds,
              'n_attempted': len(runs),
              'n_comparable': len(comparable),
              'missing_endpoints': missing,
              'seed_rows': rows,
              'primary_endpoint': protocol['primary_endpoint'],
          }
          if len(comparable) != len(seeds):
              summary['status'] = 'VALID_INCONCLUSIVE_CENSORING'
              summary['reason'] = 'At least one locked seed lacks a passing endpoint; no seed was dropped.'
          else:
              vals = np.array([float(r['log2_budget_ratio']) for r in comparable])
              wins = int(np.sum(vals < 0)); ties = int(np.sum(vals == 0)); losses = int(np.sum(vals > 0))
              rng = np.random.default_rng(20260826)
              boots = np.array([vals[rng.integers(0, len(vals), size=len(vals))].mean() for _ in range(10000)])
              lo, hi = np.quantile(boots, [0.025, 0.975])
              mean_log2 = float(vals.mean())
              n_non_tie = wins + losses
              sign_p = None if n_non_tie == 0 else sum(math.comb(n_non_tie, k) for k in range(wins, n_non_tie + 1)) / (2 ** n_non_tie)
              criteria = {
                  'all_8_comparable': True,
                  'composed_lower_at_least_7_of_8': wins >= 7,
                  'bootstrap95_upper_below_zero': float(hi) < 0.0,
              }
              test_diffs = np.array([float(r['test_r2_diff_comp_minus_sep']) for r in comparable])
              summary.update({
                  'status': 'VALID_PASS' if all(criteria.values()) else 'VALID_FAIL',
                  'criteria': criteria,
                  'wins_ties_losses': {'wins': wins, 'ties': ties, 'losses': losses},
                  'mean_log2_budget_ratio': mean_log2,
                  'bootstrap95_mean_log2_budget_ratio': [float(lo), float(hi)],
                  'geometric_mean_budget_ratio': float(2.0 ** mean_log2),
                  'one_sided_exact_sign_p': sign_p,
                  'mean_test_r2_diff_comp_minus_sep': float(test_diffs.mean()),
              })
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit immutable confirmatory evidence to research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase3/regression_external_validity/confirmatory
          git commit -m "Record locked Phase 3 regression confirmatory results"
          git push origin "HEAD:${GITHUB_REF_NAME}"
