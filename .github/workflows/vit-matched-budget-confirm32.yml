name: vit-matched-budget-confirmatory-32
on:
  push:
    branches: [research/vit-matched-budget-confirmation-32]
permissions:
  contents: read
jobs:
  seed:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed: [92826000,92826001,92826002,92826003,92826004,92826005,92826006,92826007,92826008,92826009,92826010,92826011,92826012,92826013,92826014,92826015,92826016,92826017,92826018,92826019,92826020,92826021,92826022,92826023,92826024,92826025,92826026,92826027,92826028,92826029,92826030,92826031]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0
      - run: python experiments/vit_matched_budget_confirm32/run.py --seed ${{ matrix.seed }} --out /tmp/seed_${{ matrix.seed }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vit-match32-${{ matrix.seed }}
          path: /tmp/seed_${{ matrix.seed }}/RESULT.json
          retention-days: 90
  aggregate:
    needs: seed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vit-match32-*
          path: /tmp/flat
      - run: |
          mkdir -p /tmp/all
          for d in /tmp/flat/vit-match32-*; do s=${d##*-}; mkdir -p /tmp/all/seed_$s; cp "$d/RESULT.json" /tmp/all/seed_$s/RESULT.json; done
          python experiments/vit_matched_budget_confirm32/evaluate.py /tmp/all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vit-matched-budget-confirmatory-32-result
          path: /tmp/all
          retention-days: 90
