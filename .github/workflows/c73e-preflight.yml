name: c73e-preflight
on:
  push:
    branches: [research/c73e-full-pipeline-calibration-repair]
    paths: ['.github/workflows/c73e-preflight.yml']
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
      - name: Verify syntax, three-state decisions and exact C72E bridge
        run: |
          python -m py_compile scripts/gaussian_shift_interface/c73e_pipeline.py
          python scripts/gaussian_shift_interface/c73e_pipeline.py --mode preflight --out /tmp/c73e-preflight
      - name: Export exact implementation snapshot
        run: |
          git archive --format=tar.gz --output=/tmp/c73e-preflight/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/c73e-preflight/source-commit.txt
          python -m pip freeze > /tmp/c73e-preflight/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c73e-preflight
          path: /tmp/c73e-preflight/
          retention-days: 90
          if-no-files-found: error
