name: synthetic-rank-null
on:
  push:
    branches: [research/synthetic-rank-null]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - name: Run locked synthetic mechanism experiment
        run: python scripts/mechanisms/synthetic_rank_null.py --out /tmp/synthetic-rank-null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-rank-null-result
          path: /tmp/synthetic-rank-null
          retention-days: 90
          if-no-files-found: error
