name: r87-closure-log-check
on:
  push:
    branches: [research/r87-portable-profile-validation]
    paths: ['.github/workflows/r87-closure-log-check.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Recover failed closure diagnostics only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r87-log
          gh api repos/Unjuno/canaria-neural-simplification/actions/jobs/103066405517/logs > /tmp/r87-log/full.log
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/r87-log/full.log');lines=re.sub(r'\x1b\[[0-9;]*m','',p.read_text()).splitlines()
          matches=set()
          for i,line in enumerate(lines):
              if any(w in line for w in ('FAILED','ERROR','Traceback','AssertionError','AUDIT FAIL','Error:','errors:','FAIL:')):
                  matches.update(range(max(0,i-3),min(len(lines),i+24)))
          text='\n'.join(lines[i] for i in sorted(matches))
          Path('/tmp/r87-log/FAILURE_EXCERPT.txt').write_text(text+'\n');print(text[-18000:])
          p.unlink()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r87-closure-failure-excerpt
          path: /tmp/r87-log/
