name: runtime-poc-seed4300

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install recorded environment
        run: python -m pip install -r scripts/reproduce/g7_confirmatory/requirements.txt
      - name: Run compact runtime proof of concept
        run: python scripts/reproduce/g7_confirmatory/runtime_poc.py --seed 4300 --out-dir runtime_poc_out --repeat 5
      - name: Upload runtime PoC report and artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-poc-seed4300
          path: runtime_poc_out/
