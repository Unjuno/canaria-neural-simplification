name: phase3b-stronger-teacher-stage-a

on:
  push:
    branches:
      - execution/phase3b-teacher-sweep

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU environment
        run: |
          python -m pip install numpy==2.4.6 scikit-learn==1.9.0
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run locked teacher-only Stage A
        run: |
          python scripts/phase3b/stronger_teacher_regression/explore_teacher.py \
            --out results/phase3b/stronger_teacher_regression/exploration/summary.json
      - name: Preserve execution result on execution branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase3b/stronger_teacher_regression/exploration/summary.json
          git commit -m "Record Phase 3B Stage A teacher sweep" || exit 0
          git push origin HEAD:execution/phase3b-teacher-sweep
