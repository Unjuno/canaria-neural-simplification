name: c68e-evidence-audit

on:
  push:
    branches:
      - research/c68e-teacher-validity-repair
    paths:
      - '.github/workflows/c68e-audit.yml'
      - 'scripts/gaussian_shift_interface/evaluate_c68e.py'
      - 'tests/test_c68e_evaluator.py'
      - 'results/gaussian_shift_interface/c68e/**'
  pull_request:
    paths:
      - '.github/workflows/c68e-audit.yml'
      - 'scripts/gaussian_shift_interface/evaluate_c68e.py'
      - 'tests/test_c68e_evaluator.py'
      - 'results/gaussian_shift_interface/c68e/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Evaluator tests and syntax
        run: |
          python -m py_compile scripts/gaussian_shift_interface/evaluate_c68e.py
          python -m unittest tests.test_c68e_evaluator -v
      - name: Recompute persisted C68E exploratory decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c68e.py \
            results/gaussian_shift_interface/c68e/FRESH_ROWS.json \
            --out /tmp/c68e_recomputed.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          got = json.loads(Path('/tmp/c68e_recomputed.json').read_text())
          locked = json.loads(Path('results/gaussian_shift_interface/c68e/DECISION.json').read_text())

          def same(a, b, path='root'):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert set(a) == set(b), (path, set(a) ^ set(b))
                  for k in a:
                      same(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), (path, len(a), len(b))
                  for i, (x, y) in enumerate(zip(a, b)):
                      same(x, y, f'{path}[{i}]')
              elif isinstance(a, float) or isinstance(b, float):
                  assert math.isclose(float(a), float(b), rel_tol=1e-12, abs_tol=1e-12), (path, a, b)
              else:
                  assert a == b, (path, a, b)

          same(got, locked)
          assert got['decision'] == 'ADVANCE_REPAIRED_TEACHER_TO_C69E'
          assert got['evidence_class'] == 'PROSPECTIVE_EXPLORATORY'
          assert got['confirmatory_claim_allowed'] is False
          assert got['attempted_rows_present'] == 16
          assert got['eligible_count'] == 16
          assert got['missing_seed_rows'] == []
          assert got['bootstrap_resamples'] == 100000
          assert got['bootstrap_seed'] == 2190259452
          assert got['failed_gates'] == []
          assert got['clean_accuracy_noninferiority']['pass'] is True
          assert got['shifted_accuracy_superiority']['pass'] is True
          assert got['augmented_teacher_task_validity']['pass'] is True
          print('C68E PORTABLE PERSISTED DECISION RECOMPUTATION PASS')
          PY
