name: publication-headline-reproduction
on:
  push:
    branches: [publication/announcement-candidate-2026-09-12]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  r87r2-clean-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install the locked R87R2 numerical environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduction_diagnostics/requirements-r87r2-py313.txt
          python -m pip check
      - name: Run evaluator mutation tests
        run: python scripts/reproduction_diagnostics/r87r2_confirm.py --mode selftest
      - name: Reproduce the complete locked 16-seed headline cohort from this checkout
        run: |
          mkdir -p /tmp/r87r2-clean
          python -m pip freeze > /tmp/r87r2-clean/pip-freeze.txt
          lscpu > /tmp/r87r2-clean/lscpu.txt
          git rev-parse HEAD > /tmp/r87r2-clean/source-commit.txt
          python scripts/reproduction_diagnostics/r87r2_confirm.py --mode suite --workers 2 --out /tmp/r87r2-clean
      - name: Require exact agreement with the reviewed vendored primary outcomes and decision
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/r87r2-clean')
          expected_rows = json.loads(Path('results/reproduction/r87r2_fresh_sqrt_profile/FRESH_ROWS.json').read_text())
          expected_decision = json.loads(Path('results/reproduction/r87r2_fresh_sqrt_profile/DECISION.json').read_text())
          seeds = list(range(871200, 871216))
          actual_rows = [json.loads((root / f'seed_{s}' / 'outcome.json').read_text()) for s in seeds]
          actual_decision = json.loads((root / 'DECISION.json').read_text())
          rows_exact = expected_rows.get('primary_host') == 'a' and actual_rows == expected_rows.get('rows')
          decision_exact = actual_decision == expected_decision
          report = {
              'experiment': 'R87R2_FRESH_SQRT_PROFILE_CONFIRMATION',
              'evidence_class': 'TECHNICAL_REPRODUCTION_OF_FIXED_FRESH_COHORT',
              'source_commit': os.environ.get('GITHUB_SHA'),
              'seed_count': len(actual_rows),
              'rows_exact_to_reviewed_primary': rows_exact,
              'decision_exact_to_reviewed_primary': decision_exact,
              'new_independent_scientific_seeds': 0,
              'historical_archive_recovered': False,
              'status': 'PASS' if rows_exact and decision_exact else 'FAIL',
          }
          (root / 'PUBLICATION_REPRODUCTION_CHECK.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if report['status'] != 'PASS':
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-r87r2-clean-reproduction
          path: /tmp/r87r2-clean
          retention-days: 90
          if-no-files-found: error
