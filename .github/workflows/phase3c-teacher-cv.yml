name: phase3c-teacher-cv
on:
  push:
    branches: [research/phase3c-nested-cv-regression]
    paths: ['.github/workflows/phase3c-teacher-cv.yml']
permissions:
  contents: write
jobs:
  hosts:
    strategy:
      fail-fast: false
      matrix: {host_id: [a, b]}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install locked numeric profile
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0
      - name: Verify pre-outcome chronology and corrected fixed grid
        run: |
          test "$(git hash-object scripts/phase3c/run_teacher_cv.py)" = cdfca98cb554d4964c2b63753e7828500a82d2e3
          test "$(git hash-object scripts/phase3b/stronger_teacher_regression/explore_teacher.py)" = b6518c84b0057d2da77a02432024c58c07815587
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('results/phase3c/nested_cv_teacher/PROTOCOL.json').read_text());a=json.loads(Path('results/phase3c/nested_cv_teacher/PRE_OUTCOME_AMENDMENT.json').read_text())
          assert p['status']=='LOCKED_BEFORE_PHASE3C_OUTCOMES';assert a['outcomes_generated_before_this_amendment']==0
          lock=subprocess.check_output(['git','log','--diff-filter=A','--format=%H','-1','--','results/phase3c/nested_cv_teacher/PROTOCOL.json'],text=True).strip()
          amendment=subprocess.check_output(['git','log','--diff-filter=A','--format=%H','-1','--','results/phase3c/nested_cv_teacher/PRE_OUTCOME_AMENDMENT.json'],text=True).strip()
          assert lock=='acca81d52f54e0c0ec7ca150bd4dc09784359159';assert amendment=='59e478158a8b2999cb41dc69bceac3ced997f406'
          assert not Path('results/phase3c/nested_cv_teacher/RESULT.json').exists()
          print('protocol+pre-outcome amendment verified; zero outcomes persisted')
          PY
      - name: Execute exactly 13 recipes x 5 folds x 3 seeds without outer-test evaluation
        env:
          ATEN_CPU_CAPABILITY: avx2
          MKL_CBWR: COMPATIBLE
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/phase3c-${{ matrix.host_id }}
          python scripts/phase3c/run_teacher_cv.py --out /tmp/phase3c-${{ matrix.host_id }}/RESULT.json
          lscpu > /tmp/phase3c-${{ matrix.host_id }}/lscpu.txt
          python -m pip freeze > /tmp/phase3c-${{ matrix.host_id }}/pip-freeze.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3c-teacher-cv-host-${{ matrix.host_id }}
          path: /tmp/phase3c-${{ matrix.host_id }}/
          retention-days: 90
  persist:
    needs: hosts
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: phase3c-teacher-cv-host-*
          path: /tmp/download
      - name: Require exact technical replication and persist primary result
        run: |
          python - <<'PY'
          import json,shutil,hashlib
          from pathlib import Path
          a=Path('/tmp/download/phase3c-teacher-cv-host-a/RESULT.json');b=Path('/tmp/download/phase3c-teacher-cv-host-b/RESULT.json')
          ra=json.loads(a.read_text());rb=json.loads(b.read_text());assert ra==rb,'technical host science records differ'
          assert len(ra['rows'])==195 and ra['outer_test_evaluated'] is False and ra['replacement_fitting_performed'] is False
          dst=Path('results/phase3c/nested_cv_teacher');shutil.copyfile(a,dst/'RESULT.json')
          m={'workflow_run_id':int('${{ github.run_id }}'),'source_commit':'${{ github.sha }}','technical_replication':'EXACT_PASS','rows':195,
             'protocol_lock_commit':'acca81d52f54e0c0ec7ca150bd4dc09784359159','pre_outcome_amendment_commit':'59e478158a8b2999cb41dc69bceac3ced997f406',
             'result_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'outer_test_evaluated':False}
          (dst/'RUN_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':ra['stage_c_status'],'chosen':ra['chosen_recipe'],'mean':ra['chosen_recipe_mean_validation_r2'],'min_fold_mean':ra['chosen_recipe_min_fold_mean_validation_r2'],'improvement':ra['chosen_recipe_improvement_over_baseline']}))
          PY
          git config user.name canaria-evidence-bot
          git config user.email canaria-evidence-bot@users.noreply.github.com
          git add results/phase3c/nested_cv_teacher/RESULT.json results/phase3c/nested_cv_teacher/RUN_MANIFEST.json
          git commit -m 'Persist Phase3C training-only multi-fold teacher-selection result with exact technical replication'
          git push origin HEAD:research/phase3c-nested-cv-regression
