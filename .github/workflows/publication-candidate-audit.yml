name: publication-candidate-audit
on:
  push:
    branches: [publication/announcement-candidate-2026-09-12]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  reviewed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install audit-only numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Preserve the historical integrity gate
        run: python tools/audit_publication.py --out /tmp/legacy-publication-integrity.json
      - name: Recalculate reviewed candidate evidence from vendored raw rows
        run: python tools/audit_publication_candidate.py --out /tmp/publication-candidate-audit.json
      - name: Require an explicit disposition for every currently open PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/audit_open_pr_disposition.py --live-github --out /tmp/open-pr-disposition-audit.json
      - name: Repository structural audit
        run: python tools/audit_repo.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-candidate-audit
          path: |
            /tmp/legacy-publication-integrity.json
            /tmp/publication-candidate-audit.json
            /tmp/open-pr-disposition-audit.json
          retention-days: 90
          if-no-files-found: warn
