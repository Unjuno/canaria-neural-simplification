name: research-closeout-scalar-audit
on:
  push:
    branches: [research/closeout-20261031, main]
    paths:
      - '.github/workflows/research-closeout-scalar-audit.yml'
      - 'docs/RESEARCH_MILESTONE_2026-10-31.md'
      - 'STATUS.md'
      - 'research/public_saved_analysis_20261027/**'
      - 'research/public_checkpoint_20261027/**'
      - 'research/threshold_robustness_20261027/**'
  pull_request:
    paths:
      - '.github/workflows/research-closeout-scalar-audit.yml'
      - 'docs/RESEARCH_MILESTONE_2026-10-31.md'
      - 'STATUS.md'
      - 'research/public_saved_analysis_20261027/**'
      - 'research/public_checkpoint_20261027/**'
      - 'research/threshold_robustness_20261027/**'
permissions:
  contents: read
jobs:
  saved-scalar-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen analysis-only dependency (no torch / model)
        run: python -m pip install numpy==2.3.5
      - name: Recalculate saved four-family summaries
        run: |
          cd research/public_saved_analysis_20261027
          python -m unittest discover -v
          python check_checkpoint.py ../public_checkpoint_20261027 > "$GITHUB_WORKSPACE/closeout_saved_analysis.json"
      - name: Recalculate all 25 threshold settings and compare five outputs
        run: |
          cd research/threshold_robustness_20261027
          python -m unittest discover -v
          python analyze_thresholds.py SCALAR_INPUT.json "$RUNNER_TEMP/closeout_threshold" > "$RUNNER_TEMP/threshold-stdout.json"
          for name in RESULTS.json SURFACE.csv FIRST_PASSES.csv PASS_COUNTS.csv SELECTED_MARGINS.csv; do
            cmp "results/$name" "$RUNNER_TEMP/closeout_threshold/$name"
          done
      - name: Fail-closed census and classification check
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path.cwd()
          receipt = json.loads((root / 'closeout_saved_analysis.json').read_text())
          assert set(receipt) == {'matched','grid','storage','latency'}, receipt.keys()
          assert all(v['field_count'] > 0 for v in receipt.values())
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'closeout_threshold' / 'RESULTS.json').read_text())
          settings = result['settings']
          assert len(settings) == 25
          observed = sum(s['status'] == 'ALL_PAIRS_OBSERVED' for s in settings)
          censored = sum(s['status'] == 'CENSORED_NO_COHORT_RATIO' for s in settings)
          assert (observed, censored) == (20, 5), (observed, censored)
          originals = [s for s in settings if s['original_gate']]
          assert len(originals) == 1
          assert originals[0]['direction_counts'] == {'smaller':11,'tied':4,'larger':1}
          assert originals[0]['coverage']['both'] == 16
          assert result['no_new_confidence_intervals'] is True
          assert result['no_new_data_or_model_execution'] is True
          record = {
            'status':'TECHNICAL_SCALAR_RECALC_PASS',
            'methods':'original saved scalar rows -> independent saved-analysis and post-hoc threshold scripts',
            'matched_grid_storage_latency_summary_families':len(receipt),
            'threshold_settings':len(settings),
            'all_pair_settings':observed,
            'censored_settings':censored,
            'threshold_output_files_byte_equal':5,
            'original_direction_counts':originals[0]['direction_counts'],
            'new_scientific_seeds':0,
            'new_data_or_training':False,
            'historical_issue87_recovered':False,
            'independent_experimental_replication':False,
            'external_scientific_review':False
          }
          (root / 'closeout-audit.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - name: Diagnose storage last-bit discrepancies without changing accepted data
        if: always()
        run: |
          python - <<'PY'
          import json, sys, math
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()/'research/public_saved_analysis_20261027'))
          import analyze_saved as a
          root = Path('research/public_checkpoint_20261027/research/selected_whole_storage/results')
          observed = a.storage(a.load(root/'ROWS.csv', 'storage'))
          accepted = json.loads((root/'SUMMARY.json').read_text())
          diff=[]
          for key in sorted(accepted['ratios']):
              o=observed['ratios'][key]
              e=accepted['ratios'][key]
              for field in sorted(e):
                  if o[field] != e[field]:
                      if field == 'geomean':
                          ulps=abs(o[field]-e[field])/math.ulp(e[field])
                          diff.append(dict(key=key,field=field,observed=o[field],expected=e[field],delta=o[field]-e[field],ulps=ulps))
                      else:
                          diff.append(dict(key=key,field=field,observed=o[field],expected=e[field],ulps=None))
          receipt={'input_rows':16,'ratio_entries':len(accepted['ratios']),'strict_exact_storage':not bool(diff),'discrepancies':diff,'mutated_accepted_rows':False,'mutated_scientific_source':False}
          Path('closeout_storage_diagnostic.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-closeout-scalar-audit
          path: |
            closeout-audit.json
            closeout_saved_analysis.json
            closeout_storage_diagnostic.json
          retention-days: 90
          if-no-files-found: warn
