name: research-closeout-scalar-audit
on:
  push:
    branches: [research/closeout-20261031, main]
    paths:
      - '.github/workflows/research-closeout-scalar-audit.yml'
      - 'docs/RESEARCH_MILESTONE_2026-10-31.md'
      - 'STATUS.md'
      - 'research/public_saved_analysis_20261027/**'
      - 'research/public_checkpoint_20261027/**'
      - 'research/threshold_robustness_20261027/**'
  pull_request:
    paths:
      - '.github/workflows/research-closeout-scalar-audit.yml'
      - 'docs/RESEARCH_MILESTONE_2026-10-31.md'
      - 'STATUS.md'
      - 'research/public_saved_analysis_20261027/**'
      - 'research/public_checkpoint_20261027/**'
      - 'research/threshold_robustness_20261027/**'
permissions:
  contents: read
jobs:
  saved-scalar-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen analysis-only dependency (no torch / model)
        run: python -m pip install numpy==2.3.5
      - name: Original saved-analysis synthetic unit tests
        run: |
          cd research/public_saved_analysis_20261027
          python -m unittest discover -v
      - name: Original strict summary equality gate (unchanged; failure retained)
        id: strict
        continue-on-error: true
        run: |
          cd research/public_saved_analysis_20261027
          python check_checkpoint.py ../public_checkpoint_20261027 > "$GITHUB_WORKSPACE/closeout_saved_analysis.json"
      - name: Diagnose bounded last-bit differences without altering original gate
        run: |
          python - <<'PY'
          import json, math, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'research/public_saved_analysis_20261027'))
          import analyze_saved as a
          import check_checkpoint as c
          base = Path('research/public_checkpoint_20261027/research')
          allowed = {('C_over_teacher_stored_bytes', 'geomean'), ('J_over_teacher_parameters', 'geomean')}
          differences, field_counts = [], {}
          for mode, (input_path, expected_path) in c.FILES.items():
              recalculated = getattr(a, mode)(a.load(base / input_path, mode))
              accepted = json.loads((base / expected_path).read_text())
              fields = c.EXPECTED_FIELDS[mode]
              field_counts[mode] = len(fields)
              assert all(k in recalculated and k in accepted for k in fields), mode
              for field in fields:
                  if mode != 'storage' or field != 'ratios':
                      assert recalculated[field] == accepted[field], f'{mode}: exact field mismatch: {field}'
                  else:
                      assert set(recalculated[field]) == set(accepted[field])
                      for metric in sorted(accepted[field]):
                          got = recalculated[field][metric]
                          want = accepted[field][metric]
                          assert set(got) == set(want), metric
                          for key in sorted(want):
                              if got[key] == want[key]:
                                  continue
                              assert (metric, key) in allowed, f'unexpected mismatch: {metric}.{key}'
                              assert isinstance(got[key], float) and isinstance(want[key], float)
                              assert math.isfinite(got[key]) and math.isfinite(want[key])
                              ulps = abs(got[key] - want[key]) / math.ulp(want[key])
                              assert ulps <= 1.0, f'excess numeric drift: {metric}.{key}: {ulps} ULP'
                              differences.append({
                                  'metric':metric, 'field':key,
                                  'recalculated':got[key], 'accepted':want[key],
                                  'delta':got[key]-want[key], 'ulps':ulps
                              })
          receipt = {
              'original_strict_equality_pass':len(differences) == 0,
              'posthoc_numeric_equivalence_pass':True,
              'accepted_exceptions_only':sorted([list(t) for t in allowed]),
              'observed_differences':differences,
              'summary_field_counts':field_counts,
              'original_source_and_accepted_rows_modified':False,
              'new_model_training_or_scientific_seeds':0
          }
          Path('closeout_storage_diagnostic.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Recalculate all 25 threshold settings and compare five outputs
        run: |
          cd research/threshold_robustness_20261027
          python -m unittest discover -v
          python analyze_thresholds.py SCALAR_INPUT.json "$RUNNER_TEMP/closeout_threshold" > "$RUNNER_TEMP/threshold-stdout.json"
          for name in RESULTS.json SURFACE.csv FIRST_PASSES.csv PASS_COUNTS.csv SELECTED_MARGINS.csv; do
            cmp "results/$name" "$RUNNER_TEMP/closeout_threshold/$name"
          done
      - name: Fail-closed census, original strict outcome and final classification
        env:
          STRICT_AUDIT_OUTCOME: ${{ steps.strict.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd()
          diagnostic = json.loads((root / 'closeout_storage_diagnostic.json').read_text())
          assert set(diagnostic['summary_field_counts']) == {'matched','grid','storage','latency'}
          assert all(n > 0 for n in diagnostic['summary_field_counts'].values())
          assert diagnostic['posthoc_numeric_equivalence_pass'] is True
          strict = os.environ['STRICT_AUDIT_OUTCOME']
          assert strict in ('success', 'failure')
          assert (strict == 'success') == diagnostic['original_strict_equality_pass'], strict
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'closeout_threshold' / 'RESULTS.json').read_text())
          settings = result['settings']
          assert len(settings) == 25
          observed = sum(s['status'] == 'ALL_PAIRS_OBSERVED' for s in settings)
          censored = sum(s['status'] == 'CENSORED_NO_COHORT_RATIO' for s in settings)
          assert (observed, censored) == (20, 5), (observed, censored)
          original = [s for s in settings if s['original_gate']]
          assert len(original) == 1
          assert original[0]['direction_counts'] == {'smaller':11,'tied':4,'larger':1}
          assert original[0]['coverage']['both'] == 16
          assert result['no_new_confidence_intervals'] is True
          assert result['no_new_data_or_model_execution'] is True
          rec = {
            'diagnostic_status':'STRICT_EXACT_FAIL_POSTHOC_NUMERIC_EQUIVALENCE'
              if strict == 'failure' else 'STRICT_EXACT_PASS',
            'original_strict_gate_pass':strict == 'success',
            'posthoc_bounded_storage_1ulp_diagnostic_pass':True,
            'summary_families_checked':len(diagnostic['summary_field_counts']),
            'storage_geomean_ulp_discrepancies':diagnostic['observed_differences'],
            'threshold_settings':25, 'all_pair_settings':20, 'censored_settings':5,
            'threshold_output_files_byte_equal':5,
            'original_direction_counts':original[0]['direction_counts'],
            'new_scientific_seeds':0,
            'new_data_or_model_training':False,
            'historical_issue87_recovered':False,
            'independent_experimental_replication':False,
            'external_scientific_review':False
          }
          (root / 'closeout-audit.json').write_text(json.dumps(rec,indent=2)+'\n')
          print(json.dumps(rec,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-closeout-scalar-audit
          path: |
            closeout-audit.json
            closeout_saved_analysis.json
            closeout_storage_diagnostic.json
          retention-days: 90
          if-no-files-found: warn
