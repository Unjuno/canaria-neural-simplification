name: phase4-california-fresh
on:
  push:
    branches: [research/phase4-california-regression]
    paths: ['.github/workflows/phase4-california-fresh.yml']
permissions:
  contents: read
  actions: read
jobs:
  hosts:
    strategy:
      fail-fast: false
      matrix: {host_id: [a, b]}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install locked numeric environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0
      - name: Verify protocol, source, Stage A and preflight chronology
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git hash-object scripts/phase4/run_california_confirm_seed.py)" = b5380db6c28fbb1204f5e3a8cadf5475118941e7
          test "$(git hash-object results/phase4/california_regression/STAGE_B_CONFIRMATORY_PROTOCOL.json)" = 4b3508bd78d6bb6ff3a98043500d39393ecfef9c
          gh api repos/Unjuno/canaria-neural-simplification/actions/runs/34611586958 --jq '.conclusion' | grep -x success
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('results/phase4/california_regression/STAGE_B_CONFIRMATORY_PROTOCOL.json').read_text())
          a=json.loads(Path('results/phase4/california_regression/STAGE_A_RESULT.json').read_text())
          assert p['status']=='LOCKED_BEFORE_STAGE_B_OUTCOMES' and p['fresh_model_seeds']==list(range(2900,2908))
          assert a['stage_a_status']=='PASS_SELECT_RECIPE' and a['chosen_recipe']['id']=='low_lr_30' and a['test_evaluated'] is False
          lock=subprocess.check_output(['git','log','--diff-filter=A','--format=%H','-1','--','results/phase4/california_regression/STAGE_B_CONFIRMATORY_PROTOCOL.json'],text=True).strip()
          assert lock=='4dade6ea65db5dc5dcb11d5f3e6f38f2e2ee6a0b'
          assert not Path('results/phase4/california_regression/STAGE_B_DECISION.json').exists()
          print('Stage A PASS, Stage B protocol lock and preflight PASS verified')
          PY
      - name: Execute all eight fresh seeds exactly once on this technical host
        env:
          ATEN_CPU_CAPABILITY: avx2
          MKL_CBWR: COMPATIBLE
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/phase4-${{ matrix.host_id }}
          for s in 2900 2901 2902 2903 2904 2905 2906 2907; do
            python scripts/phase4/run_california_confirm_seed.py --seed "$s" --out "/tmp/phase4-${{ matrix.host_id }}/seed_${s}.json"
          done
          python scripts/phase4/evaluate_california_confirm.py --inputs /tmp/phase4-${{ matrix.host_id }}/seed_*.json --out /tmp/phase4-${{ matrix.host_id }}/DECISION.json
          lscpu > /tmp/phase4-${{ matrix.host_id }}/lscpu.txt
          python -m pip freeze > /tmp/phase4-${{ matrix.host_id }}/pip-freeze.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4-stage-b-host-${{ matrix.host_id }}
          path: /tmp/phase4-${{ matrix.host_id }}/
          retention-days: 90
  aggregate:
    needs: hosts
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: phase4-stage-b-host-*
          path: /tmp/download
      - name: Compare technical repetitions and construct aggregate evidence
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          a=Path('/tmp/download/phase4-stage-b-host-a');b=Path('/tmp/download/phase4-stage-b-host-b');out=Path('/tmp/aggregate');out.mkdir()
          pairs=[];rows=[]
          for s in range(2900,2908):
              ra=json.loads((a/f'seed_{s}.json').read_text());rb=json.loads((b/f'seed_{s}.json').read_text())
              def science(r):
                  x=json.loads(json.dumps(r));x.get('provenance',{}).pop('platform',None);return x
              exact=science(ra)==science(rb);pairs.append({'seed':s,'scientific_record_exact':exact});rows.append(ra);shutil.copyfile(a/f'seed_{s}.json',out/f'seed_{s}.json')
          da=json.loads((a/'DECISION.json').read_text());db=json.loads((b/'DECISION.json').read_text());decision_exact=da==db;tech=all(x['scientific_record_exact'] for x in pairs) and decision_exact
          shutil.copyfile(a/'DECISION.json',out/'DECISION.json')
          (out/'FRESH_ROWS.json').write_text(json.dumps({'primary_host':'a','rows':rows},indent=2,sort_keys=True)+'\n')
          (out/'TECHNICAL_REPLICATION.json').write_text(json.dumps({'status':'PASS' if tech else 'FAIL','decision_exact':decision_exact,'pairs':pairs},indent=2,sort_keys=True)+'\n')
          manifest={'workflow_run_id':int('${{ github.run_id }}'),'source_commit':'${{ github.sha }}','preflight_run_id':34611586958,'protocol_lock_commit':'4dade6ea65db5dc5dcb11d5f3e6f38f2e2ee6a0b','stage_a_evidence_commit':'42792c8d10e405de3919cf22a87afae30e16eef0','fresh_seeds':list(range(2900,2908)),'primary_decision':da['decision'],'technical_replication':'PASS' if tech else 'FAIL'}
          (out/'RUN_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n');print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4-stage-b-aggregate
          path: /tmp/aggregate/
          retention-days: 90
