name: phase4-california-stage-a
on:
  push:
    branches: [research/phase4-california-regression]
    paths: ['.github/workflows/phase4-california-stage-a.yml']
permissions:
  contents: write
jobs:
  hosts:
    strategy:
      fail-fast: false
      matrix: {host_id: [a, b]}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install locked numeric environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0
      - name: Verify Stage A chronology and source identities
        run: |
          test "$(git hash-object scripts/phase4/run_california_teacher_stage_a.py)" = 3fd0e538cf385869efb5125c9941db49e40bd8d1
          test "$(git hash-object results/phase4/california_regression/STAGE_A_PROTOCOL.json)" = 8debff31858bc6014e76ef03afa3c41d040cc98d
          test "$(git hash-object scripts/phase3/regression_external_validity/run_seed.py)" = 8dd3ddefb59ba250f5deca2d98d04fbff0055748
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('results/phase4/california_regression/STAGE_A_PROTOCOL.json').read_text())
          assert p['status']=='LOCKED_BEFORE_STAGE_A_OUTCOMES' and p['no_test_evaluation'] and p['no_replacement_fitting']
          assert p['reserved_future_confirmatory_model_seeds']==list(range(2900,2908))
          lock=subprocess.check_output(['git','log','--diff-filter=A','--format=%H','-1','--','results/phase4/california_regression/STAGE_A_PROTOCOL.json'],text=True).strip()
          assert lock=='a1c9ff1691b4b84f45c1b812e1fd6b6ecefeea6b'
          assert not Path('results/phase4/california_regression/STAGE_A_RESULT.json').exists()
          print('locked before outcomes')
          PY
      - name: Execute fixed 7-recipe teacher-only calibration; no test evaluation
        env:
          ATEN_CPU_CAPABILITY: avx2
          MKL_CBWR: COMPATIBLE
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/phase4-${{ matrix.host_id }}
          python scripts/phase4/run_california_teacher_stage_a.py --out /tmp/phase4-${{ matrix.host_id }}/RESULT.json
          lscpu > /tmp/phase4-${{ matrix.host_id }}/lscpu.txt
          python -m pip freeze > /tmp/phase4-${{ matrix.host_id }}/pip-freeze.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4-stage-a-host-${{ matrix.host_id }}
          path: /tmp/phase4-${{ matrix.host_id }}/
          retention-days: 90
  persist:
    needs: hosts
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: phase4-stage-a-host-*
          path: /tmp/download
      - name: Compare exact calibration results and persist
        run: |
          python - <<'PY'
          import json,shutil,hashlib
          from pathlib import Path
          a=Path('/tmp/download/phase4-stage-a-host-a/RESULT.json');b=Path('/tmp/download/phase4-stage-a-host-b/RESULT.json')
          ra=json.loads(a.read_text());rb=json.loads(b.read_text());assert ra==rb,'technical host Stage-A records differ'
          assert len(ra['rows'])==21 and ra['test_evaluated'] is False and ra['replacement_fitting_performed'] is False
          dst=Path('results/phase4/california_regression');shutil.copyfile(a,dst/'STAGE_A_RESULT.json')
          m={'workflow_run_id':int('${{ github.run_id }}'),'source_commit':'${{ github.sha }}','protocol_lock_commit':'a1c9ff1691b4b84f45c1b812e1fd6b6ecefeea6b','technical_replication':'EXACT_PASS','rows':21,'test_evaluated':False,'result_sha256':hashlib.sha256(a.read_bytes()).hexdigest()}
          (dst/'STAGE_A_RUN_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':ra['stage_a_status'],'chosen':ra['chosen_recipe'],'mean_val_r2':ra['chosen_recipe_mean_validation_r2'],'min_val_r2':ra['chosen_recipe_min_validation_r2'],'dataset':ra['dataset']}))
          PY
          git config user.name canaria-evidence-bot
          git config user.email canaria-evidence-bot@users.noreply.github.com
          git add results/phase4/california_regression/STAGE_A_RESULT.json results/phase4/california_regression/STAGE_A_RUN_MANIFEST.json
          git commit -m 'Persist Phase4 California teacher-only Stage A result with exact technical replication'
          git push origin HEAD:research/phase4-california-regression
