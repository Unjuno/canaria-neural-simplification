name: r87-portable-profile-validation
on:
  push:
    branches: [research/r87-portable-profile-validation]
    paths: ['.github/workflows/r87-profile-validation.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p /tmp/source
          git archive --format=tar.gz HEAD > /tmp/source/source.tar.gz
          git rev-parse HEAD > /tmp/source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r87d5-source
          path: /tmp/source
          retention-days: 90
          if-no-files-found: error
  hosts:
    strategy:
      fail-fast: false
      matrix:
        slot: [a,b]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin primary numerical and torch dependency environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0 joblib==1.5.3 threadpoolctl==3.6.0 sympy==1.14.0 networkx==3.6.1 filelock==3.29.0 fsspec==2026.4.0 jinja2==3.1.6 typing_extensions==4.16.0
          python -m pip check
      - name: Complete exact bridge, both profiles, eight known seeds and four repeats
        run: |
          mkdir -p /tmp/r87d5
          python -m pip freeze > /tmp/r87d5/pip-freeze.txt
          lscpu > /tmp/r87d5/lscpu.txt
          python scripts/reproduction_diagnostics/r87_profile.py --mode suite --out /tmp/r87d5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r87d5-host-${{ matrix.slot }}
          path: /tmp/r87d5
          retention-days: 90
          if-no-files-found: error
