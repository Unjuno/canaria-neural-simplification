name: create-v0.2.0-release-boundary

on:
  push:
    branches:
      - research/phase2-precision-quantization
    paths:
      - .github/workflows/release-v020-boundary.yml

permissions:
  contents: write

jobs:
  release-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen baseline commit
        run: git cat-file -e 556dce21c7a5516a16780cb28d528d1ff3968e53^{commit}

      - name: Create frozen snapshot tag
        run: |
          set -euo pipefail
          TAG=v0.2.0-public-snapshot
          BASE=556dce21c7a5516a16780cb28d528d1ff3968e53
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --tags origin
            ACTUAL=$(git rev-list -n 1 "${TAG}")
            test "${ACTUAL}" = "${BASE}"
          else
            git tag -a "${TAG}" "${BASE}" -m "Canaria v0.2.0 public research snapshot"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.0-public-snapshot
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exit 0
          fi
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          Public research snapshot centered on task-conditioned compositional simplification, including original residual-CNN evidence, direct SmallViT and residual-MLP replications, training-time consolidation/recontracting, preserved negative and invalidated results, an exact portable G7 confirmatory reproduction, and a bounded CPU runtime/materialization proof of concept.

          This frozen v0.2.0 snapshot does not claim universal mathematical complexity reduction, large-LLM validity, or general RAM/GPU/runtime gains. Post-v0.2.0 Phase 2 evidence and the independent pre-publication correction review are carried by the subsequent reviewed release-candidate PR rather than retroactively changing this frozen baseline.
          EOF
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Canaria v0.2.0 — Public Research Snapshot" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
