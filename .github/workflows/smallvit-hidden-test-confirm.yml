name: smallvit-hidden-test-confirm
on:
  push:
    branches: [research/smallvit-hidden-test-confirmation]
permissions:
  contents: read
jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        seed: [9200, 9201, 9202, 9203, 9204, 9205, 9206, 9207, 9208, 9209, 9210, 9211, 9212, 9213, 9214, 9215]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 scikit-learn==1.9.0
      - name: Run one fresh seed with test firewall
        run: python scripts/replication/vit_hidden_test_confirm.py --seed ${{ matrix.seed }} --out /tmp/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smallvit-hidden-test-seed-${{ matrix.seed }}
          path: /tmp/out/seed_${{ matrix.seed }}.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: smallvit-hidden-test-seed-*
          path: /tmp/all
          merge-multiple: true
      - name: Evaluate locked decision
        run: python scripts/replication/evaluate_vit_hidden_test_confirm.py --input /tmp/all --out /tmp/DECISION.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smallvit-hidden-test-confirmatory-result
          path: |
            /tmp/all/seed_*.json
            /tmp/DECISION.json
          retention-days: 90
          if-no-files-found: error
