name: phase3b-stage-a-formal
on:
  push:
    branches: [research/phase3b-stronger-teacher-regression]
    paths: ['.github/workflows/phase3b-stage-a-formal.yml']
permissions:
  contents: write
jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exactly specified Stage A environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 scikit-learn==1.9.0
      - name: Verify locked source and environment
        run: |
          python - <<'PY'
          import hashlib,json,platform,torch,numpy,sklearn
          from pathlib import Path
          protocol=Path('results/phase3b/stronger_teacher_regression/EXPLORATION_PROTOCOL.json')
          runner=Path('scripts/phase3b/stronger_teacher_regression/explore_teacher.py')
          p=json.loads(protocol.read_text())
          assert p['status']=='LOCKED_BEFORE_STAGE_A_OUTCOMES'
          assert p['seeds']==[2300,2301,2302]
          assert hashlib.sha1(runner.read_bytes()).hexdigest()=='b6518c84b0057d2da77a02432024c58c07815587'
          assert platform.python_version().startswith('3.11.')
          assert numpy.__version__=='2.4.6'
          assert sklearn.__version__=='1.9.0'
          assert torch.__version__.startswith('2.13.0')
          torch.set_num_threads(1)
          print({'python':platform.python_version(),'numpy':numpy.__version__,'sklearn':sklearn.__version__,'torch':torch.__version__})
          PY
      - name: Execute locked calibration-only Stage A
        run: |
          mkdir -p results/phase3b/stronger_teacher_regression/formal_stage_a
          python scripts/phase3b/stronger_teacher_regression/explore_teacher.py --out results/phase3b/stronger_teacher_regression/formal_stage_a/RESULT.json
          python - <<'PY'
          import json,platform,subprocess,torch,numpy,sklearn
          from pathlib import Path
          p=Path('results/phase3b/stronger_teacher_regression/formal_stage_a/RESULT.json')
          r=json.loads(p.read_text())
          r['formal_environment']={'python':platform.python_version(),'numpy':numpy.__version__,'scikit_learn':sklearn.__version__,'torch':torch.__version__,'torch_threads':torch.get_num_threads()}
          r['workflow_run_id']=int(__import__('os').environ['GITHUB_RUN_ID'])
          r['source_commit']=__import__('os').environ['GITHUB_SHA']
          r['formal_stage_a']=True
          r['diagnostic_2026_08_27_was_not_formal_evidence']=True
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          assert r['test_evaluated'] is False and r['replacement_fitting_performed'] is False
          PY
      - name: Persist formal Stage A result
        run: |
          git config user.name canaria-evidence-bot
          git config user.email canaria-evidence-bot@users.noreply.github.com
          git add results/phase3b/stronger_teacher_regression/formal_stage_a/RESULT.json
          git commit -m 'Persist formal locked Phase3B Stage A teacher-selection result in specified environment'
          git push origin HEAD:research/phase3b-stronger-teacher-regression
