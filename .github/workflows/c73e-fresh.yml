name: c73e-fresh
on:
  push:
    branches: [research/c73e-full-pipeline-calibration-repair]
    paths: ['.github/workflows/c73e-fresh.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require completed preflight before consuming fresh seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/Unjuno/canaria-neural-simplification/actions/runs/34139282843',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req))
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='18f451697cb472f36d4e44c526b0b7547a71347a'
          print('C73E PREFLIGHT GATE PASS')
          PY
  seeds:
    needs: preflight-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [71400,71401,71402,71403,71404,71405,71406,71407,71408,71409,71410,71411,71412,71413,71414,71415]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked original CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
      - name: Execute locked paired pipeline seed
        run: |
          python scripts/gaussian_shift_interface/c73e_pipeline.py --mode seed --seed ${{ matrix.seed }} --out /tmp/c73e/seed_${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: c73e-seed-${{ matrix.seed }}
          path: /tmp/c73e/
          retention-days: 90
          if-no-files-found: error
  aggregate:
    if: always()
    needs: [preflight-gate,seeds]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: c73e-seed-*
          merge-multiple: true
          path: /tmp/c73e-raw
      - name: Validate and aggregate every attempted seed
        run: |
          mkdir -p /tmp/c73e-raw
          python scripts/gaussian_shift_interface/c73e_pipeline.py --mode aggregate --input /tmp/c73e-raw --out /tmp/c73e-result
      - uses: actions/download-artifact@v4
        with:
          name: c73e-preflight
          run-id: 34139282843
          github-token: ${{ github.token }}
          path: /tmp/c73e-preflight
      - name: Recompute and preserve full records, source chronology and result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,math,os,shutil,urllib.request
          from pathlib import Path
          from scripts.gaussian_shift_interface.c73e_pipeline import evaluate,validate_full_record,digest
          dest=Path('results/gaussian_shift_interface/c73e')
          d=json.loads(Path('/tmp/c73e-result/DECISION.json').read_text())
          rows=json.loads(Path('/tmp/c73e-result/FRESH_ROWS.json').read_text())['rows']
          assert evaluate(rows)==d
          for r in rows:
              validate_full_record(r)
              assert r['github_sha']==os.environ['GITHUB_SHA']
              for p,h in r['source_sha256'].items(): assert digest(p)==h,(p,h)
          for name in ('FRESH_ROWS.json','DECISION.json'):
              shutil.copyfile(Path('/tmp/c73e-result')/name,dest/name)
          (dest/'raw').mkdir(exist_ok=True)
          for p in Path('/tmp/c73e-raw').glob('seed_*.json'): shutil.copyfile(p,dest/'raw'/p.name)
          (dest/'preflight').mkdir(exist_ok=True)
          for name in ('bridge_70300.json','verification_71300.json','environment.txt'):
              shutil.copyfile(Path('/tmp/c73e-preflight')/name,dest/'preflight'/name)
          req=urllib.request.Request('https://api.github.com/repos/Unjuno/canaria-neural-simplification/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/artifacts?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          arts=json.load(urllib.request.urlopen(req))['artifacts']
          manifest={'protocol_lock_commit':'01a0fa95c69cf477359d130b290a112fd95e7557','preflight_run_id':34139282843,'fresh_run_id':int(os.environ['GITHUB_RUN_ID']),'fresh_source_commit':os.environ['GITHUB_SHA'],'record_count':len(rows),'artifacts':[{k:a[k] for k in ('id','name','digest','created_at','expires_at')} for a in arts],'files_sha256':{str(p.relative_to(dest)):digest(p) for p in sorted(dest.rglob('*')) if p.is_file()}}
          (dest/'RUN_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          audit={'status':'PASS','scope':'source/raw record/count/NMSE integrity and decision recomputation, not independent scientific review','complete_cohort':len(rows)==16,'recomputed_decision_identical':True,'test_evaluated':False}
          (dest/'AUDIT.json').write_text(json.dumps(audit,indent=2)+'\n')
          text=['# C73E: full-pipeline calibration repair','','Evidence: PROSPECTIVE_EXPLORATORY. Main/public claims unchanged.','','Decision: `'+d['decision']+'`.','', 'All planned seeds must be present; PASS/FAIL/UNCERTAIN are distinct. A failed non-inferiority gate is not proof of inferiority.','','| Cell | Mean gap to robust teacher (pp) | 95% CI (pp) | Gate |','|---|---:|---|---|']
          for k,v in d.get('cells',{}).items(): text.append(f"| {k} | {v['mean_pp']:.6f} | {v['bootstrap95_pp']} | {v['status']} |")
          text+=['','## Descriptive paired contrasts','']
          for k,v in d.get('descriptive_contrasts',{}).items(): text.append(f"- {k}: {v['mean_pp']:.6f} pp, 95% {v['bootstrap95_pp']}")
          text+=['','## Boundaries','No reduced dimension selected. This is Residual-MLP only. Seed intervals are conditional on the fixed digits split and fixed nested calibration sets. Raw MSE and separate denominators are recorded; independently normalized NMSE values are not a common-scale generalization gap. Each mapping fit uses 600 updates and batch128, hence 76800 draws at both sample sizes.','', 'Preflight reproduces C72E direct-path teacher/data/state hashes and metrics exactly on bridge70300 in the same pinned CPU environment. No held-out test was used.']
          (dest/'RESULT.md').write_text('\n'.join(text)+'\n')
          (dest/'LINEAGE.md').write_text('# C73E lineage\n\nC71E stage-localization plus C72E nested calibration intervention. Protocol lock 01a0fa95c69cf477359d130b290a112fd95e7557 precedes all fresh outcomes. See RUN_MANIFEST.json for source and execution IDs. No imported Residual-CNN result is reconstructed here.\n')
          print('C73E TERMINAL',d['decision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c73e-closed-evidence
          path: results/gaussian_shift_interface/c73e/
          retention-days: 90
          if-no-files-found: error
      - name: Commit only this experiment evidence
        run: |
          git config user.name canaria-evidence-bot
          git config user.email canaria-evidence-bot@users.noreply.github.com
          git add results/gaussian_shift_interface/c73e
          if ! git diff --cached --quiet; then
            git commit -m 'Persist C73E paired pipeline raw results and strict decision audit'
            git push origin HEAD:research/c73e-full-pipeline-calibration-repair
          fi
      - name: Export resumable scientific source and evidence snapshot
        run: |
          mkdir -p /tmp/c73e-source
          git archive --format=tar.gz --output=/tmp/c73e-source/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/c73e-source/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c73e-source-and-evidence
          path: /tmp/c73e-source/
          retention-days: 90
          if-no-files-found: error
