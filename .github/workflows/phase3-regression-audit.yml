name: phase3-regression-evidence-audit

on:
  push:
    branches:
      - research/phase3-regression-external-validity
    paths:
      - .github/workflows/phase3-regression-audit.yml
      - tools/audit_phase3_regression.py
      - results/phase3/regression_external_validity/**
      - docs/phase3/REGRESSION_EXTERNAL_VALIDITY.md

permissions:
  contents: read

jobs:
  audit-phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependency
        run: python -m pip install numpy
      - name: Recompute Phase 3 evidence invariants
        run: python tools/audit_phase3_regression.py
