name: publication-validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-numeric-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned numerical stack
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Integrity is distinct from numerical reproduction
        run: |
          python -m unittest discover -s tests -v
          python tools/audit_repo.py
          python tools/audit_publication.py
          mkdir -p /tmp/publication-repeat
          python -m pip freeze > /tmp/publication-repeat/pip-freeze.txt
          lscpu > /tmp/publication-repeat/lscpu.txt
          git rev-parse HEAD > /tmp/publication-repeat/source-commit.txt
      - name: Strict original eight-seed comparison (known Issue87 mismatch is NOT ignored)
        run: python scripts/reproduce/core_discovery_digits/verify_confirmatory.py --out /tmp/publication-repeat/core-cohort-report.json --raw-dir /tmp/publication-repeat/raw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-core-cohort-reproduction
          path: /tmp/publication-repeat/
          retention-days: 90
          if-no-files-found: error
