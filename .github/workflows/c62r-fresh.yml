name: c62r-fresh-exploratory

on:
  push:
    branches:
      - research/c62r-p2-frontier-mechanism
    paths:
      - '.github/workflows/c62r-fresh.yml'

jobs:
  fresh-seeds:
    name: seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [60400, 60401, 60402, 60403, 60404, 60405, 60406, 60407, 60408, 60409, 60410, 60411, 60412, 60413, 60414, 60415]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Run locked fresh seed
        run: |
          mkdir -p c62r-seed
          python scripts/gaussian_shift_interface/run_c62r_seed.py \
            --seed ${{ matrix.seed }} \
            --out c62r-seed/seed_${{ matrix.seed }}.json
      - name: Assert fresh provenance and mechanism integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          seed = int('${{ matrix.seed }}')
          r = json.loads(Path(f'c62r-seed/seed_{seed}.json').read_text())
          assert r['seed'] == seed
          assert r['status'] == 'FRESH_SEED_OUTCOME'
          assert r['evidence_class'] == 'PROSPECTIVE_EXPLORATORY'
          assert r['test_evaluated'] is False
          assert r['protocol']['sigma'] == 0.04
          assert r['protocol']['calibration_samples'] == 192
          assert r['protocol']['dimensions'] == [2, 4]
          assert r['protocol']['basis_families'] == ['qr', 'svd', 'random']
          assert r['budget']['exact_4096_each_level'] is True
          expected = {'qr_p2','qr_p4','svd_p2','svd_p4','random_p2','random_p4'}
          assert set(r['conditions']) == expected
          assert r['eligible'] is True
          e = r['diagnostics']['energy_capture']
          for k in ('k2','k4'):
              assert e['svd'][k]['calibration'] + 1e-6 >= e['qr'][k]['calibration']
              assert e['svd'][k]['calibration'] + 1e-6 >= e['random'][k]['calibration']
          print('C62R FRESH SEED INTEGRITY PASS', seed)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c62r-seed-${{ matrix.seed }}
          path: c62r-seed/seed_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: locked-exploratory-aggregate
    if: always()
    needs: fresh-seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Download all successful seed artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: c62r-seed-*
          path: downloaded
          merge-multiple: true
      - name: Build complete attempted-row ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = list(range(60400, 60416))
          rows_by_seed = {}
          for p in Path('downloaded').glob('seed_*.json'):
              full = json.loads(p.read_text())
              row = full['decision_row']
              rows_by_seed[int(row['seed'])] = row
          rows = []
          for seed in expected:
              if seed in rows_by_seed:
                  rows.append(rows_by_seed[seed])
              else:
                  rows.append({'seed': seed, 'eligible': False, 'failure': 'missing_seed_artifact'})
          Path('c62r-aggregate').mkdir(exist_ok=True)
          Path('c62r-aggregate/rows.json').write_text(json.dumps({'rows': rows}, indent=2, sort_keys=True) + '\n')
          print('successful_seed_artifacts', len(rows_by_seed))
          print(Path('c62r-aggregate/rows.json').read_text())
          PY
      - name: Apply prospectively locked exploratory decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c62r.py \
            c62r-aggregate/rows.json \
            --out c62r-aggregate/decision.json
          cat c62r-aggregate/decision.json
      - name: Assert decision class
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('c62r-aggregate/decision.json').read_text())
          assert d['confirmatory_claim_allowed'] is False
          assert d['decision'] in {
              'ADVANCE_QR_P2_TO_C63R',
              'STOP_P2_FRONTIER_AT_C62R',
              'STOP_INSUFFICIENT_ELIGIBLE',
          }
          print('C62R EXPLORATORY DECISION', d['decision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c62r-aggregate-decision
          path: c62r-aggregate/
          if-no-files-found: error
          retention-days: 90
