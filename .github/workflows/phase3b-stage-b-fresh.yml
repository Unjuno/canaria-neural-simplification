name: phase3b-stage-b-fresh
on:
  push:
    branches: [research/phase3b-confirmatory]
    paths: ['.github/workflows/phase3b-stage-b-fresh.yml']
permissions:
  contents: read
jobs:
  hosts:
    strategy:
      fail-fast: false
      matrix:
        host_id: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install locked numerical environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0 scipy==1.17.0
      - name: Verify protocol chronology and successful preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git hash-object scripts/phase3/regression_external_validity/run_seed.py)" = 8dd3ddefb59ba250f5deca2d98d04fbff0055748
          test "$(git hash-object results/phase3b/stronger_teacher_regression/STAGE_B_CONFIRMATORY_PROTOCOL.json)" = 16bf7eebbc5836bb18b218cf00fb575da63f9dda
          gh api repos/Unjuno/canaria-neural-simplification/actions/runs/34608513778 --jq '.conclusion' | grep -x success
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('results/phase3b/stronger_teacher_regression/STAGE_B_CONFIRMATORY_PROTOCOL.json').read_text())
          assert p['fresh_model_seeds']==list(range(2400,2408))
          lock=subprocess.check_output(['git','log','--diff-filter=A','--format=%H','-1','--','results/phase3b/stronger_teacher_regression/STAGE_B_CONFIRMATORY_PROTOCOL.json'],text=True).strip()
          assert lock=='9c834076a40ec988f7ace799150515061c7ec6c8'
          print('locked protocol and preflight PASS')
          PY
      - name: Execute all eight locked fresh seeds exactly once on this technical host
        env:
          ATEN_CPU_CAPABILITY: avx2
          MKL_CBWR: COMPATIBLE
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/phase3b-${{ matrix.host_id }}
          for s in 2400 2401 2402 2403 2404 2405 2406 2407; do
            python scripts/phase3b/stronger_teacher_regression/run_stage_b_seed.py --seed "$s" --out "/tmp/phase3b-${{ matrix.host_id }}/seed_${s}.json"
          done
          python scripts/phase3b/stronger_teacher_regression/evaluate_stage_b.py --inputs /tmp/phase3b-${{ matrix.host_id }}/seed_*.json --out /tmp/phase3b-${{ matrix.host_id }}/DECISION.json
          python - <<'PY'
          import json,platform,subprocess
          from pathlib import Path
          root=Path('/tmp/phase3b-${{ matrix.host_id }}')
          meta={'host_id':'${{ matrix.host_id }}','workflow_run_id':int('${{ github.run_id }}'),'source_commit':'${{ github.sha }}',
                'platform':platform.platform(),'lscpu':subprocess.check_output(['lscpu'],text=True)}
          (root/'HOST.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3b-stage-b-host-${{ matrix.host_id }}
          path: /tmp/phase3b-${{ matrix.host_id }}/
          retention-days: 90
  aggregate:
    needs: hosts
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: phase3b-stage-b-host-*
          path: /tmp/download
      - name: Compare technical repetitions and construct immutable aggregate ledger
        run: |
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          a=Path('/tmp/download/phase3b-stage-b-host-a');b=Path('/tmp/download/phase3b-stage-b-host-b');out=Path('/tmp/aggregate');out.mkdir()
          rows=[];technical=[]
          for s in range(2400,2408):
              ra=json.loads((a/f'seed_{s}.json').read_text());rb=json.loads((b/f'seed_{s}.json').read_text())
              # Provenance platform strings are descriptive host metadata. Scientific records exclude only that host-dependent field.
              def science(r):
                  x=json.loads(json.dumps(r));x.get('provenance',{}).pop('platform',None);return x
              exact=science(ra)==science(rb);technical.append({'seed':s,'scientific_record_exact':exact})
              rows.append(ra);shutil.copyfile(a/f'seed_{s}.json',out/f'seed_{s}.json')
          da=json.loads((a/'DECISION.json').read_text());db=json.loads((b/'DECISION.json').read_text())
          technical_pass=all(x['scientific_record_exact'] for x in technical) and da==db
          shutil.copyfile(a/'DECISION.json',out/'DECISION.json')
          (out/'FRESH_ROWS.json').write_text(json.dumps({'primary_host':'a','rows':rows},indent=2,sort_keys=True)+'\n')
          (out/'TECHNICAL_REPLICATION.json').write_text(json.dumps({'status':'PASS' if technical_pass else 'FAIL','pairs':technical,'decision_exact':da==db},indent=2,sort_keys=True)+'\n')
          manifest={'workflow_run_id':int('${{ github.run_id }}'),'source_commit':'${{ github.sha }}','preflight_run_id':34608513778,
                    'protocol_lock_commit':'9c834076a40ec988f7ace799150515061c7ec6c8','fresh_seeds':list(range(2400,2408)),
                    'primary_decision':da['decision'],'technical_replication':'PASS' if technical_pass else 'FAIL'}
          (out/'RUN_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3b-stage-b-aggregate
          path: /tmp/aggregate/
          retention-days: 90
