name: post-v02-independent-review

on:
  push:
    branches:
      - review/post-v02-independent-2026-09-12
  pull_request:
    paths:
      - 'tools/review_post_v02_claims.py'
      - '.github/workflows/post-v02-independent-review.yml'
      - 'docs/POST_V02_INDEPENDENT_REVIEW_2026-09-12.md'
      - 'publication/POST_V02_CLAIM_LEDGER.json'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fetch reviewed research refs explicitly
        run: |
          git fetch origin \
            +refs/heads/research/r87-portable-profile-validation:refs/remotes/origin/research/r87-portable-profile-validation \
            +refs/heads/research/phase3b-confirmatory:refs/remotes/origin/research/phase3b-confirmatory \
            +refs/heads/research/phase3c-nested-cv-regression:refs/remotes/origin/research/phase3c-nested-cv-regression \
            +refs/heads/research/phase4-california-regression:refs/remotes/origin/research/phase4-california-regression
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install audit dependency
        run: python -m pip install numpy==2.3.5
      - name: Recompute reviewed evidence from persisted rows
        run: python tools/review_post_v02_claims.py --out /tmp/post-v02-review.json
      - name: Show review output
        run: cat /tmp/post-v02-review.json
