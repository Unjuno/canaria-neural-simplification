name: c63r-fresh-confirmatory

on:
  push:
    branches:
      - research/c63r-p2-confirmation
    paths:
      - '.github/workflows/c63r-fresh.yml'

jobs:
  fresh-seeds:
    name: seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [61400, 61401, 61402, 61403, 61404, 61405, 61406, 61407, 61408, 61409, 61410, 61411, 61412, 61413, 61414, 61415]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Run locked fresh confirmatory seed
        run: |
          mkdir -p c63r-seed
          python scripts/gaussian_shift_interface/run_c63r_seed.py \
            --seed ${{ matrix.seed }} \
            --out c63r-seed/seed_${{ matrix.seed }}.json
      - name: Assert fresh confirmatory provenance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          seed = int('${{ matrix.seed }}')
          r = json.loads(Path(f'c63r-seed/seed_{seed}.json').read_text())
          assert r['seed'] == seed
          assert r['experiment'] == 'C63R_QR_P2_VS_P4_CONFIRMATION'
          assert r['evidence_class'] == 'PROSPECTIVE_CONFIRMATORY'
          assert r['status'] == 'FRESH_SEED_OUTCOME'
          assert r['test_evaluated'] is False
          assert r['protocol']['sigma'] == 0.04
          assert r['protocol']['calibration_samples'] == 192
          assert r['protocol']['dimensions'] == [2, 4]
          assert r['protocol']['top_adaptation_seed'] == seed + 635000
          assert r['protocol']['final_init_seed'] == seed + 636000
          assert r['protocol']['final_fit_seed'] == seed + 637000
          assert r['budget']['exact_4096_each_level'] is True
          assert r['p2']['dimension'] == 2
          assert r['p4']['dimension'] == 4
          assert r['eligible'] is True
          print('C63R FRESH SEED INTEGRITY PASS', seed)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c63r-seed-${{ matrix.seed }}
          path: c63r-seed/seed_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: locked-confirmatory-aggregate
    if: always()
    needs: fresh-seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Download all successful seed artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: c63r-seed-*
          path: downloaded
          merge-multiple: true
      - name: Build complete attempted-row ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = list(range(61400, 61416))
          rows_by_seed = {}
          for p in Path('downloaded').glob('seed_*.json'):
              full = json.loads(p.read_text())
              row = full['decision_row']
              rows_by_seed[int(row['seed'])] = row
          rows = []
          for seed in expected:
              if seed in rows_by_seed:
                  rows.append(rows_by_seed[seed])
              else:
                  rows.append({'seed': seed, 'eligible': False, 'failure': 'missing_seed_artifact'})
          Path('c63r-aggregate').mkdir(exist_ok=True)
          Path('c63r-aggregate/rows.json').write_text(json.dumps({'rows': rows}, indent=2, sort_keys=True) + '\n')
          print('successful_seed_artifacts', len(rows_by_seed))
          print(Path('c63r-aggregate/rows.json').read_text())
          PY
      - name: Apply prospectively locked confirmatory decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c63r.py \
            c63r-aggregate/rows.json \
            --out c63r-aggregate/decision.json
          cat c63r-aggregate/decision.json
      - name: Assert terminal decision class
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('c63r-aggregate/decision.json').read_text())
          assert d['decision'] in {
              'C63R_CONFIRMATORY_PASS',
              'C63R_CONFIRMATORY_FAIL',
              'STOP_INSUFFICIENT_ELIGIBLE',
          }
          print('C63R TERMINAL DECISION', d['decision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c63r-aggregate-decision
          path: c63r-aggregate/
          if-no-files-found: error
          retention-days: 90
