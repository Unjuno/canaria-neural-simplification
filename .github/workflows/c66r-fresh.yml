name: c66r-fresh-exploratory

on:
  push:
    branches:
      - research/c66r-shift-severity-frontier
    paths:
      - '.github/workflows/c66r-fresh.yml'

jobs:
  fresh-seeds:
    name: seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [64400, 64401, 64402, 64403, 64404, 64405, 64406, 64407, 64408, 64409, 64410, 64411, 64412, 64413, 64414, 64415]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
      - name: Run locked fresh severity seed
        run: |
          mkdir -p c66r-seed
          python scripts/gaussian_shift_interface/run_c66r_seed.py \
            --seed ${{ matrix.seed }} \
            --out c66r-seed/seed_${{ matrix.seed }}.json
      - name: Assert fresh severity provenance boundary
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          seed = int('${{ matrix.seed }}')
          r = json.loads(Path(f'c66r-seed/seed_{seed}.json').read_text())
          assert r['seed'] == seed
          assert r['experiment'] == 'C66R_SHIFT_SEVERITY_FRONTIER_EXPLORATION'
          assert r['evidence_class'] == 'PROSPECTIVE_EXPLORATORY'
          assert r['status'] == 'FRESH_SEED_OUTCOME'
          assert r['test_evaluated'] is False
          assert r['eligible'] is True
          assert r['protocol']['sigmas'] == [0.04, 0.08, 0.12, 0.16, 0.20]
          assert r['protocol']['calibration_samples'] == 192
          assert r['protocol']['conditions'] == ['p0', 'p2']
          assert r['protocol']['common_calibration_epsilon_seed'] == seed + 660100
          assert r['protocol']['common_validation_epsilon_seed'] == seed + 660200
          assert r['protocol']['p2_top_adaptation_seed'] == seed + 665000
          assert r['protocol']['final_init_seed'] == seed + 666000
          assert r['protocol']['final_fit_seed'] == seed + 667000
          assert r['budget']['exact_4096_each_level'] is True
          assert r['provenance_hashes']['calibration_standard_normal_sha256']
          assert r['provenance_hashes']['validation_standard_normal_sha256']
          for key in ('0.04','0.08','0.12','0.16','0.20'):
              rec = r['sigma_results'][key]
              assert abs(rec['sigma'] - float(key)) < 1e-12
              assert rec['p0']['dimension'] == 0
              assert rec['p0']['teacher_correction_applied'] is False
              assert rec['p0']['top_boundary_adaptation_skipped'] is True
              assert rec['p2']['dimension'] == 2
              assert rec['p2']['teacher_correction_applied'] is True
              assert rec['p2']['top_boundary_adaptation_skipped'] is False
              assert r['provenance_hashes']['per_sigma'][key]['shifted_calibration_tensor_sha256']
              assert r['provenance_hashes']['per_sigma'][key]['shifted_validation_tensor_sha256']
              assert r['provenance_hashes']['per_sigma'][key]['nested_q2_sha256']
              for p in ('p0','p2'):
                  assert math.isfinite(float(rec[p]['final_replacement_val_acc']))
                  assert math.isfinite(float(rec[p]['final_nmse_vs_original']))
                  assert float(rec[p]['final_nmse_vs_original']) > 0.0
              for mkey, value in rec['mechanism'].items():
                  assert math.isfinite(float(value)), (key, mkey, value)
              for mkey in ('frozen_hierarchy_activation_nmse_vs_teacher','p2_euclidean_capture_fraction','p2_logit_l2_retained_ratio','p2_fisher_retained_ratio'):
                  assert float(rec['mechanism'][mkey]) >= 0.0
          print('C66R FRESH SEED INTEGRITY PASS', seed)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c66r-seed-${{ matrix.seed }}
          path: c66r-seed/seed_${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: locked-severity-frontier-aggregate
    if: always()
    needs: fresh-seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluator dependency
        run: python -m pip install numpy==2.4.6
      - name: Download all successful seed artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: c66r-seed-*
          path: downloaded
          merge-multiple: true
      - name: Build complete attempted-row ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = list(range(64400, 64416))
          rows_by_seed = {}
          for p in Path('downloaded').glob('seed_*.json'):
              full = json.loads(p.read_text())
              row = full['decision_row']
              rows_by_seed[int(row['seed'])] = row
          rows = []
          for seed in expected:
              if seed in rows_by_seed:
                  rows.append(rows_by_seed[seed])
              else:
                  rows.append({'seed': seed, 'eligible': False, 'failure': 'missing_seed_artifact'})
          Path('c66r-aggregate').mkdir(exist_ok=True)
          Path('c66r-aggregate/rows.json').write_text(json.dumps({'rows': rows}, indent=2, sort_keys=True) + '\n')
          print('successful_seed_artifacts', len(rows_by_seed))
          print(Path('c66r-aggregate/rows.json').read_text())
          PY
      - name: Apply prospectively locked severity-frontier decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c66r.py \
            c66r-aggregate/rows.json \
            --out c66r-aggregate/decision.json
          cat c66r-aggregate/decision.json
      - name: Assert terminal decision class
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('c66r-aggregate/decision.json').read_text())
          allowed = {
              'STOP_INSUFFICIENT_ELIGIBLE',
              'STOP_REPLICATION_INSTABILITY_AT_SIGMA_0_04',
              'NO_P0_FAILURE_THROUGH_SIGMA_0_20',
              'STOP_NONMONOTONIC_FRONTIER',
              'SELECT_SIGMA_0_08_FOR_C67R',
              'SELECT_SIGMA_0_12_FOR_C67R',
              'SELECT_SIGMA_0_16_FOR_C67R',
              'SELECT_SIGMA_0_20_FOR_C67R',
          }
          assert d['decision'] in allowed, d['decision']
          assert d['confirmatory_claim_allowed'] is False
          print('C66R TERMINAL DECISION', d['decision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c66r-aggregate-decision
          path: c66r-aggregate/
          if-no-files-found: error
          retention-days: 90
