name: repository-audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU reproduction environment
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/reproduce/core_discovery_digits/requirements-pinned-py311.txt
          python -m pip install -e .
          python - <<'PY'
          import importlib.metadata
          import torch
          expected = {
              'numpy': '2.4.6',
              'torch': '2.13.0',
              'scikit-learn': '1.9.0',
          }
          for name, version in expected.items():
              got = importlib.metadata.version(name)
              assert got.split('+', 1)[0] == version, (name, got, version)
          assert torch.version.cuda is None, torch.version.cuda
          print('PINNED CPU ENV PASS')
          PY
      - name: Reusable codec tests
        run: python -m unittest discover -s tests -v
      - name: Syntax, evidence, and correction audit
        run: python tools/audit_repo.py
      - name: Gaussian-shift import integrity audit
        run: |
          python -m py_compile scripts/gaussian_shift_interface/evaluate_c61.py
          python -m py_compile scripts/gaussian_shift_interface/evaluate_c61r.py
          python -m py_compile scripts/gaussian_shift_interface/run_c61r_seed.py
          python -m py_compile tools/audit_gaussian_shift_interface.py
          python tools/audit_gaussian_shift_interface.py
      - name: Recompute persisted C61R confirmatory decision
        run: |
          python scripts/gaussian_shift_interface/evaluate_c61r.py \
            results/gaussian_shift_interface/c61r/FRESH_ROWS.json \
            --out /tmp/c61r_recomputed.json
          python - <<'PY'
          import json
          from pathlib import Path

          got = json.loads(Path('/tmp/c61r_recomputed.json').read_text())
          locked = json.loads(Path('results/gaussian_shift_interface/c61r/DECISION.json').read_text())

          assert got['decision'] == locked['decision'] == 'C61R_CONFIRMATORY_PASS'
          assert got['attempted_rows_present'] == locked['attempted_rows_present'] == 16
          assert got['eligible_count'] == locked['eligible_count'] == 16
          assert got['missing_seed_rows'] == locked['missing_seed_rows'] == []
          assert got['bootstrap_resamples'] == locked['bootstrap']['resamples'] == 100000
          assert got['bootstrap_seed'] == locked['bootstrap']['rng_seed'] == 3960519679

          gv = got['validation_noninferiority']
          lv = locked['validation_noninferiority']
          assert gv['mean_difference_fraction'] == lv['mean_difference_p4_minus_p8_fraction']
          assert gv['mean_difference_pp'] == lv['mean_difference_p4_minus_p8_pp']
          assert gv['bootstrap95_fraction'] == lv['bootstrap95_fraction']
          assert gv['bootstrap95_pp'] == lv['bootstrap95_pp']
          assert gv['margin_pp'] == lv['margin_pp'] == -2.0
          assert gv['pass'] is lv['pass'] is True

          gn = got['nmse_ratio']
          ln = locked['nmse_ratio']
          assert gn['geometric_mean_p4_over_p8'] == ln['geometric_mean_p4_over_p8']
          assert gn['bootstrap95'] == ln['bootstrap95']
          assert gn['margin'] == ln['margin'] == 1.25
          assert gn['pass'] is ln['pass'] is True

          assert got['informative_p4_delta_nmse_vs_frozen_mean'] == locked['informative_p4_delta_nmse_vs_frozen_mean']
          print('C61R PERSISTED DECISION RECOMPUTATION PASS')
          PY
      - name: Pre-announcement readiness audit
        run: python tools/audit_readiness.py
      - name: Representative core-runner smoke test
        run: |
          python scripts/reproduce/core_discovery_digits/run_confirmatory.py \
            --seed 1200 \
            --out /tmp/canaria_seed1200.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/canaria_seed1200.json').read_text())
          assert result['selected_sep']['budget'] == 3072, result['selected_sep']
          assert result['selected_comp']['budget'] == 1536, result['selected_comp']
          assert result['log2_budget_ratio'] == -1.0, result['log2_budget_ratio']
          print('CORE RUNNER SMOKE PASS')
          PY
