name: repository-audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reusable package and public-runner dependencies
        run: python -m pip install -e . numpy torch scikit-learn
      - name: Reusable codec tests
        run: python -m unittest discover -s tests -v
      - name: Syntax, evidence, and correction audit
        run: python tools/audit_repo.py
      - name: Minimal public runner smoke test
        run: |
          python scripts/reproduce/core_discovery_digits/run_confirmatory.py \
            --seed 1200 \
            --out /tmp/canaria_seed1200.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/canaria_seed1200.json').read_text())
          assert result['selected_sep']['budget'] == 3072, result['selected_sep']
          assert result['selected_comp']['budget'] == 1536, result['selected_comp']
          assert result['log2_budget_ratio'] == -1.0, result['log2_budget_ratio']
          print('PUBLIC RUNNER SMOKE PASS')
          PY

  phase3b_stage_a:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/execution/phase3b-run-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Stage A environment
        run: |
          python -m pip install numpy==2.4.6 scikit-learn==1.9.0
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute locked teacher-only sweep
        run: |
          python scripts/phase3b/stronger_teacher_regression/explore_teacher.py \
            --out phase3b_stage_a_summary.json
      - name: Show decision summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('phase3b_stage_a_summary.json').read_text())
          assert d['test_evaluated'] is False
          assert d['replacement_fitting_performed'] is False
          print(json.dumps({
              'stage_a_status': d['stage_a_status'],
              'baseline_mean_validation_r2': d['baseline_mean_validation_r2'],
              'chosen_recipe': d['chosen_recipe'],
              'chosen_recipe_mean_validation_r2': d['chosen_recipe_mean_validation_r2'],
              'chosen_recipe_improvement_over_baseline': d['chosen_recipe_improvement_over_baseline'],
              'test_evaluated': d['test_evaluated'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3b-stage-a-summary
          path: phase3b_stage_a_summary.json
          if-no-files-found: error
